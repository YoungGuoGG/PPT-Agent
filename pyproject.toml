[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-agent-v2"
version = "0.1.0"
description = "A planner-driven, review-oriented presentation agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["ppt_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/ppt_agent/tests"]
