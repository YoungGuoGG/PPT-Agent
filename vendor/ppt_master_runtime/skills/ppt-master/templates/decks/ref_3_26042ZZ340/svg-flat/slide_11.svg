<g id="shape-36" data-name="Rectangle 3">
<rect x="8.63" y="215.82" width="631.37" height="306.37" fill="none" stroke="none"/>
<text x="18.23" y="238.75" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">近几年来，随着商品生产和流通方式的全新，我国物流业迎来了</tspan><tspan x="18.23" dy="32" fill="#000000" font-size="21.33">蓬勃发展的“青春期”、“黄金期”。</tspan><tspan fill="#000000" font-size="21.33">202X</tspan><tspan fill="#000000" font-size="21.33">年，我国社会物流总额达</tspan><tspan x="18.23" dy="32" fill="#000000" font-size="21.33">125</tspan><tspan fill="#000000" font-size="21.33">万亿元，物流市场总规模达</tspan><tspan fill="#000000" font-size="21.33">4.9</tspan><tspan fill="#000000" font-size="21.33">万亿元，物流业增加值达到</tspan><tspan x="18.23" dy="32" fill="#000000" font-size="21.33">2.7</tspan><tspan fill="#000000" font-size="21.33">万亿元，较“十五”期末的</tspan><tspan fill="#000000" font-size="21.33">2005</tspan><tspan fill="#000000" font-size="21.33">年均实现了翻番。</tspan><tspan fill="#000000" font-size="21.33">202X</tspan><tspan fill="#000000" font-size="21.33">年，物</tspan><tspan x="18.23" dy="32" fill="#000000" font-size="21.33">流业增加值占</tspan><tspan fill="#000000" font-size="21.33">GDP</tspan><tspan fill="#000000" font-size="21.33">的比重约为</tspan><tspan fill="#000000" font-size="21.33">7%</tspan><tspan fill="#000000" font-size="21.33">，占第三产业增加值的比重约为</tspan><tspan x="18.23" dy="32" fill="#000000" font-size="21.33">16%</tspan><tspan fill="#000000" font-size="21.33">。社会物流总费用与</tspan><tspan fill="#000000" font-size="21.33">GDP</tspan><tspan fill="#000000" font-size="21.33">的比率约为</tspan><tspan fill="#000000" font-size="21.33">18%</tspan><tspan fill="#000000" font-size="21.33">左右，比</tspan><tspan fill="#000000" font-size="21.33">2005</tspan><tspan fill="#000000" font-size="21.33">年降低了</tspan><tspan x="18.23" dy="32" fill="#000000" font-size="21.33">0.3</tspan><tspan fill="#000000" font-size="21.33">个百分点。我国物流业的发展，有力地支持了国民经济发展及</tspan><tspan x="18.23" dy="32" fill="#000000" font-size="21.33">经济发展方式的转变。</tspan></text>
</g>
