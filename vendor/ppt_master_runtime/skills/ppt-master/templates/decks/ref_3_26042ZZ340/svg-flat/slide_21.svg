<text x="706.42" y="260.87" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;宋体&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000" font-weight="bold"><tspan fill="#000000" font-size="21.33" font-weight="bold">   </tspan><tspan fill="#000000" font-size="21.33">近年来我国的铁路、公路、机场建设都在超常</tspan><tspan x="706.42" dy="32" fill="#000000" font-size="21.33">规发展，特别是铁路建设，客货分线使得铁路运</tspan><tspan x="706.42" dy="32" fill="#000000" font-size="21.33">能得到释放，部分的地方铁路正在逐步由卖方市</tspan><tspan x="706.42" dy="32" fill="#000000" font-size="21.33">场向买方市场转变。沿海的港口，比如大连、宁</tspan><tspan x="706.42" dy="32" fill="#000000" font-size="21.33">波、营口等，都是在向腹地延伸自己的物流覆盖</tspan><tspan x="706.42" dy="32" fill="#000000" font-size="21.33">范围，各地的物流园区等节点设施逐步形成了网</tspan><tspan x="706.42" dy="32" fill="#000000" font-size="21.33">络，使得铁路、水路、公路等多种运输方式协流</tspan></text>
</g>
