<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720"><defs><linearGradient id="ggrad1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EF6B68"/><stop offset="1" stop-color="#EF6B68"/><stop offset="0.53" stop-color="#EF6B68"/></linearGradient><linearGradient id="ggrad2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#395D7C"/><stop offset="1" stop-color="#395D7C"/><stop offset="0.53" stop-color="#395D7C"/></linearGradient></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<g id="shape-147459" data-name="Rectangle 3">
<rect x="757.59" y="195.21" width="469.09" height="255.28" fill="none" stroke="none"/>
<text x="767.19" y="218.14" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">随着工业化推进和产业升级，工业物流运行模式</tspan><tspan x="767.19" dy="17.07" fill="#000000" font-size="21.33">发生了深刻变化。工业企业加快资源整合、流程</tspan><tspan x="767.19" dy="17.07" fill="#000000" font-size="21.33">改造，采取多种方式分离外包物流功能。</tspan></text>


<text x="767.19" y="307.74" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">一是分离分立。如，上海安吉汽车物流、淮矿现</tspan><tspan x="767.19" dy="17.07" fill="#000000" font-size="21.33">代物流等，将企业物流业务从主业中分离出来，</tspan><tspan x="767.19" dy="17.07" fill="#000000" font-size="21.33">成立了面向社会服务的物流企业。</tspan></text>


<text x="767.19" y="397.34" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">二是合资合作。如，青岛啤酒招商物流、芜湖安</tspan><tspan x="767.19" dy="17.07" fill="#000000" font-size="21.33">得物流等，由制造企业与物流企业合资组建物流</tspan><tspan x="767.19" dy="17.07" fill="#000000" font-size="21.33">公司。三是全面外包。如，海信集模将海信电器</tspan><tspan x="767.19" dy="17.07" fill="#000000" font-size="21.33">的物流业务全盘委托给专业物流公司管理。</tspan></text>
</g>
