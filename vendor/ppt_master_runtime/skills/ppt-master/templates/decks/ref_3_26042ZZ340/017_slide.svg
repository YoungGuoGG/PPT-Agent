<g id="shape-25" data-name="Rectangle 3">
<rect x="127.95" y="250.88" width="482.42" height="360" fill="none" stroke="none"/>
<text x="137.55" y="273.81" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">由于我</tspan><tspan fill="#000000" font-size="21.33">国</tspan><tspan fill="#000000" font-size="21.33">经济</tspan><tspan fill="#000000" font-size="21.33">的逐步</tspan><tspan fill="#000000" font-size="21.33">回升，推动了物流规模的稳</tspan><tspan x="137.55" dy="32" fill="#000000" font-size="21.33">步扩张，刚刚公布的三季度的经济发展达到了</tspan><tspan x="137.55" dy="32" fill="#000000" font-size="21.33">10.6的增长，我</tspan><tspan fill="#000000" font-size="21.33">国</tspan><tspan fill="#000000" font-size="21.33">上半年的物流业</tspan><tspan fill="#000000" font-size="21.33">总额同比</tspan><tspan fill="#000000" font-size="21.33">增</tspan><tspan fill="#000000" font-size="21.33">长1</tspan><tspan x="137.55" dy="32" fill="#000000" font-size="21.33">0%</tspan><tspan fill="#000000" font-size="21.33">，所以进入一个稳步增长的阶段</tspan><tspan fill="#000000" font-size="21.33">。我国的地区</tspan><tspan x="137.55" dy="32" fill="#000000" font-size="21.33">结构、行业结构、品种结构、企业结构，都在进</tspan><tspan x="137.55" dy="32" fill="#000000" font-size="21.33">行一些深度的调整，</tspan><tspan fill="#000000" font-size="21.33">又</tspan><tspan fill="#000000" font-size="21.33">会</tspan><tspan fill="#000000" font-size="21.33">促进物流业的结构调整</tspan><tspan x="137.55" dy="32" fill="#000000" font-size="21.33">。</tspan></text>
</g>
