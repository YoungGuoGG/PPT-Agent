<g id="shape-7" data-name="矩形 6">
<rect x="38.21" y="227.83" width="640" height="346.32" fill="none"/>
<text x="47.81" y="250.76" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">• </tspan><tspan fill="#000000" font-size="21.33">一是生产资料流通企业和传统批发市场增加储存、加工、配送、</tspan><tspan x="47.81" dy="25.6" fill="#000000" font-size="21.33">网上交易等物流功能。如中国物资储运、五矿物流、广东欧浦钢铁</tspan><tspan x="47.81" dy="25.6" fill="#000000" font-size="21.33">物流等，形成了“贸易</tspan><tspan fill="#000000" font-size="21.33">+</tspan><tspan fill="#000000" font-size="21.33">物流”的新模式。</tspan></text>
<text x="47.81" y="327.56" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">• </tspan><tspan fill="#000000" font-size="21.33">二是大型连锁零售企业强化物流系统，如苏宁、国美等，构建和</tspan><tspan x="47.81" dy="25.6" fill="#000000" font-size="21.33">完善自身物流网络。</tspan></text>
<text x="47.81" y="378.76" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">• </tspan><tspan fill="#000000" font-size="21.33">三是网购物流“爆炸式”增长。</tspan><tspan fill="#000000" font-size="21.33">202X</tspan><tspan fill="#000000" font-size="21.33">年，我国网络购物总额达</tspan><tspan x="47.81" dy="25.6" fill="#000000" font-size="21.33">4500</tspan><tspan fill="#000000" font-size="21.33">亿元，比</tspan><tspan fill="#000000" font-size="21.33">5</tspan><tspan fill="#000000" font-size="21.33">年前增长</tspan><tspan fill="#000000" font-size="21.33">22</tspan><tspan fill="#000000" font-size="21.33">倍，国内每天流转的快件量高达</tspan><tspan fill="#000000" font-size="21.33">1000</tspan><tspan fill="#000000" font-size="21.33">万</tspan><tspan x="47.81" dy="25.6" fill="#000000" font-size="21.33">票。四是农业和农村物流集中释放。“万村千乡市场工程”、“家电</tspan><tspan x="47.81" dy="25.6" fill="#000000" font-size="21.33">模板”、“汽车摩托车模板”和“农超对接”等政策的实施，农产品进</tspan><tspan x="47.81" dy="25.6" fill="#000000" font-size="21.33">城、农资和日用工业品模板带来的物流需求有较快增长。 </tspan></text>
</g>
