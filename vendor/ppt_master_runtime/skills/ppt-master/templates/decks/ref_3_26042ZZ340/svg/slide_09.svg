<g id="shape-21" data-name="矩形 20">
<rect x="566.49" y="201.87" width="640" height="316.27" fill="none"/>
<text x="576.09" y="224.8" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000" font-weight="bold"><tspan fill="#000000" font-size="21.33" font-weight="bold">     物流业对经济社会发展的贡献：</tspan></text>
<text x="576.09" y="256.8" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">• </tspan><tspan fill="#000000" font-size="21.33">从规模方面讲，</tspan><tspan fill="#000000" font-size="21.33">09</tspan><tspan fill="#000000" font-size="21.33">年的时候，我国社会物流总额，达到了</tspan><tspan fill="#000000" font-size="21.33">96.65</tspan><tspan x="576.09" dy="32" fill="#000000" font-size="21.33">万亿元，每一个单位的</tspan><tspan fill="#000000" font-size="21.33">GDP</tspan><tspan fill="#000000" font-size="21.33">需要</tspan><tspan fill="#000000" font-size="21.33">3</tspan><tspan fill="#000000" font-size="21.33">个单位的物流量来支撑；</tspan></text>
<text x="576.09" y="320.8" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">• </tspan><tspan fill="#000000" font-size="21.33">从经济结构方面来讲，</tspan><tspan fill="#000000" font-size="21.33">2009</tspan><tspan fill="#000000" font-size="21.33">年，我国物流业增加值占到全部服务</tspan><tspan x="576.09" dy="32" fill="#000000" font-size="21.33">业增加值的比重大概是</tspan><tspan fill="#000000" font-size="21.33">16.1</tspan><tspan fill="#000000" font-size="21.33">，那么物流业每增加</tspan><tspan fill="#000000" font-size="21.33">6</tspan><tspan fill="#000000" font-size="21.33">个百分点，就可</tspan><tspan x="576.09" dy="32" fill="#000000" font-size="21.33">以带动服务业增加</tspan><tspan fill="#000000" font-size="21.33">1</tspan><tspan fill="#000000" font-size="21.33">个百分点；</tspan></text>
<text x="576.09" y="416.8" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">• </tspan><tspan fill="#000000" font-size="21.33">从就业方面讲，物流业每增加一个百分点，就可以新增</tspan><tspan fill="#000000" font-size="21.33">10</tspan><tspan fill="#000000" font-size="21.33">万个就</tspan><tspan x="576.09" dy="32" fill="#000000" font-size="21.33">业岗位。 </tspan></text>
</g>
