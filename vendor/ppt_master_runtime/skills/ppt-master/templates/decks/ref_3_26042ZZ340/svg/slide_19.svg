<g id="shape-9" data-name="矩形 6">
<rect x="47.83" y="196.11" width="640" height="458.44" fill="none" stroke="none"/>
<text x="57.43" y="219.04" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">u </tspan><tspan x="57.43" dy="25.6" fill="#000000" font-size="21.33">一个原因是</tspan><tspan fill="#000000" font-size="21.33">国外的物流企业已经全面进入到中国的市场，典型的就</tspan><tspan x="57.43" dy="25.6" fill="#000000" font-size="21.33">是我</tspan><tspan fill="#000000" font-size="21.33">国</tspan><tspan fill="#000000" font-size="21.33">的海运业务</tspan><tspan fill="#000000" font-size="21.33">、</tspan><tspan fill="#000000" font-size="21.33">国际快递业务</tspan><tspan fill="#000000" font-size="21.33">和</tspan><tspan fill="#000000" font-size="21.33">物流地产，已经是国外的企业</tspan><tspan x="57.43" dy="25.6" fill="#000000" font-size="21.33">占了优势或者垄断的地位</tspan><tspan fill="#000000" font-size="21.33">，对我国的物流企业很不利</tspan><tspan fill="#000000" font-size="21.33">。</tspan></text>

<text x="57.43" y="357.44" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">u </tspan><tspan x="57.43" dy="32" fill="#000000" font-size="21.33">另一个原因是</tspan><tspan fill="#000000" font-size="21.33">国内的物流业门槛低、经营主体庞杂，一个典型的就</tspan><tspan x="57.43" dy="32" fill="#000000" font-size="21.33">是</tspan><tspan fill="#000000" font-size="21.33">汽车</tspan><tspan fill="#000000" font-size="21.33">运输业，我国</tspan><tspan fill="#000000" font-size="21.33">共</tspan><tspan fill="#000000" font-size="21.33">有1300万辆的载重汽车的拥有量，有632万</tspan><tspan x="57.43" dy="32" fill="#000000" font-size="21.33">家的运输主体，也就是一个主体还不到2辆车，好多都是一家一户</tspan><tspan x="57.43" dy="32" fill="#000000" font-size="21.33">一辆车，就是一个运输主体</tspan><tspan fill="#000000" font-size="21.33">。</tspan><tspan fill="#000000" font-size="21.33">各类物流要素</tspan><tspan fill="#000000" font-size="21.33">如燃油、土地、人力成</tspan><tspan x="57.43" dy="32" fill="#000000" font-size="21.33">本等都在逐年上升，推高了物流企业的经营风险，汽车运输业普遍</tspan><tspan x="57.43" dy="32" fill="#000000" font-size="21.33">超载已经成为一个难以解决的问题</tspan><tspan fill="#000000" font-size="21.33">。</tspan></text>

</g>
