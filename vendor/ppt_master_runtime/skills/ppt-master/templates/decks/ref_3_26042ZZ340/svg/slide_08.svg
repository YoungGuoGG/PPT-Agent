<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720"><defs><linearGradient id="ggrad1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EF6B68"/><stop offset="1" stop-color="#EF6B68"/><stop offset="0.53" stop-color="#EF6B68"/></linearGradient><linearGradient id="ggrad2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#395D7C"/><stop offset="1" stop-color="#395D7C"/><stop offset="0.53" stop-color="#395D7C"/></linearGradient></defs><g id="shape-2" data-name="Rectangle 3">
<rect x="104.07" y="217.92" width="535.93" height="179.5" fill="none" stroke="none"/>
<text x="113.67" y="240.85" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">2009</tspan><tspan fill="#000000" font-size="21.33">年</tspan><tspan fill="#000000" font-size="21.33">3</tspan><tspan fill="#000000" font-size="21.33">月，由发布的我国第一个全国性物流业专项规</tspan><tspan x="113.67" dy="32" fill="#000000" font-size="21.33">划</tspan><tspan fill="#000000" font-size="21.33">《</tspan><tspan fill="#000000" font-size="21.33">物流业调整和振兴规划</tspan><tspan fill="#000000" font-size="21.33">》</tspan><tspan fill="#000000" font-size="21.33">中指出：物流业是融合运</tspan><tspan x="113.67" dy="32" fill="#000000" font-size="21.33">输业、仓储业、货代业和信息业等的复合型服务产业，</tspan><tspan x="113.67" dy="32" fill="#000000" font-size="21.33">是国民经济的重要组成部分，涉及领域广、吸纳就业人</tspan><tspan x="113.67" dy="32" fill="#000000" font-size="21.33">员多，促进生产，拉动消费作用大，在促进产业结构调</tspan><tspan x="113.67" dy="32" fill="#000000" font-size="21.33">整，转变经济发展方式和增强国民经济竞争力等方面发</tspan></text>
</g>
