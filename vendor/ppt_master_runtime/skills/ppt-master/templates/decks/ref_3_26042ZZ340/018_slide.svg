<g id="shape-31" data-name="Rectangle 3">
<rect x="521.37" y="238.67" width="703.17" height="360" fill="none" stroke="none"/>
<text x="530.97" y="261.6" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">制</tspan><tspan fill="#000000" font-size="21.33">造业物流出现了整合、分离、外包的趋势。从制造业当中分离出来专业</tspan><tspan x="530.97" dy="25.6" fill="#000000" font-size="21.33">的物流企业，又进行一些外包，这个趋势是发展得比较快的。</tspan></text>
<text x="530.97" y="312.8" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">流通业出现了提升、改造、分流的趋势，比如生产资料批发市场、农产品</tspan><tspan x="530.97" dy="25.6" fill="#000000" font-size="21.33">批发市场，都在提升，改造增加一些物流功能，同时大型的连锁零售企业</tspan><tspan x="530.97" dy="25.6" fill="#000000" font-size="21.33">，又在强化自己的物流部门，因为那是他的核心竞争力。</tspan></text>
<text x="530.97" y="389.6" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">电子商务或者一些专业的物流，又在</tspan><tspan fill="#000000" font-size="21.33">进行</tspan><tspan fill="#000000" font-size="21.33">分离外包。我</tspan><tspan fill="#000000" font-size="21.33">国</tspan><tspan fill="#000000" font-size="21.33">的农业物流出现</tspan><tspan x="530.97" dy="25.6" fill="#000000" font-size="21.33">了集中、双向对接的趋势，典型的是寿光的蔬菜市场，</tspan><tspan fill="#000000" font-size="21.33">比如</tspan><tspan fill="#000000" font-size="21.33">内蒙的土豆，</tspan><tspan x="530.97" dy="25.6" fill="#000000" font-size="21.33">都会运到寿光去，再运到北京来，集中的趋势很明显</tspan><tspan fill="#000000" font-size="21.33">。</tspan><tspan fill="#000000" font-size="21.33">双向</tspan><tspan fill="#000000" font-size="21.33">对接指</tspan><tspan fill="#000000" font-size="21.33">的是农</tspan><tspan x="530.97" dy="25.6" fill="#000000" font-size="21.33">产品要进城，日用品和农资要模板，比如说农超对接这些发展也是很快的</tspan><tspan x="530.97" dy="25.6" fill="#000000" font-size="21.33">。</tspan></text>
</g>
