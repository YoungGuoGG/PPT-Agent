<text x="848.84" y="252.47" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">城镇化的加速，</tspan><tspan fill="#000000" font-size="21.33">也</tspan><tspan fill="#000000" font-size="21.33">在改变</tspan><tspan fill="#000000" font-size="21.33">着</tspan><tspan fill="#000000" font-size="21.33">物流圈</tspan><tspan x="848.84" dy="25.6" fill="#000000" font-size="21.33">的格局，我们国家每年有1000万人</tspan><tspan x="848.84" dy="25.6" fill="#000000" font-size="21.33">由农村进入城市，</tspan><tspan fill="#000000" font-size="21.33">也会引起物流格</tspan><tspan x="848.84" dy="25.6" fill="#000000" font-size="21.33">局的变化</tspan><tspan fill="#000000" font-size="21.33">。</tspan></text>
</g>
<g id="shape-46" data-name="矩形 45">
<rect x="116.36" y="375.17" width="355.97" height="138.94" fill="none"/>
<text x="125.96" y="398.1" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">近年来，我国自东部向中西部的</tspan><tspan fill="#000000" font-size="21.33">产</tspan><tspan x="125.96" dy="25.6" fill="#000000" font-size="21.33">业</tspan><tspan fill="#000000" font-size="21.33">迁</tspan><tspan fill="#000000" font-size="21.33">移带动了物流</tspan><tspan fill="#000000" font-size="21.33">圈</tspan><tspan fill="#000000" font-size="21.33">的转移，特别</tspan><tspan x="125.96" dy="25.6" fill="#000000" font-size="21.33">是在富士康事件以后，珠三角、长</tspan><tspan x="125.96" dy="25.6" fill="#000000" font-size="21.33">三角一带</tspan><tspan fill="#000000" font-size="21.33">产业迁</tspan><tspan fill="#000000" font-size="21.33">移的速度在加快，</tspan><tspan x="125.96" dy="25.6" fill="#000000" font-size="21.33">物流带</tspan><tspan fill="#000000" font-size="21.33">也随之</tspan><tspan fill="#000000" font-size="21.33">转移</tspan><tspan fill="#000000" font-size="21.33">。</tspan></text>
</g>
