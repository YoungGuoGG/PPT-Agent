<g id="shape-10" data-name="文本框 9">
<rect x="59.67" y="327.67" width="513.53" height="201.73" fill="none"/>
<text x="69.27" y="348.33" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000"><tspan fill="#000000" font-size="18.67">他的神情、他的声音、他衣角一条蜿蜒的纹路，他一切的一</tspan><tspan x="69.27" dy="31.73" fill="#000000" font-size="18.67">切，都足以回味千百遍，在黑暗或光明的河流里千缠百绕，</tspan><tspan x="69.27" dy="31.73" fill="#000000" font-size="18.67">长出花叶参天。或有樵夫看尽了枯荣，问为什么爱呢？可是</tspan><tspan x="69.27" dy="31.73" fill="#000000" font-size="18.67">在遥远的人之初，第一次心跳加速，第一次手足无措，第一</tspan><tspan x="69.27" dy="31.73" fill="#000000" font-size="18.67">次相思无从。谁又能说得清，为什么爱呢？</tspan></text>
</g></svg>