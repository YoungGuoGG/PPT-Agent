<g id="shape-5" data-name="文本框 4">
<rect x="301.75" y="554.25" width="676.5" height="82.4" fill="none"/>
<text x="640" y="572.65" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="16" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="16">有时候我希望你的一生能被拍成一部漫长的电影。然后让我比你晚出生一百年，一辈子只做一</tspan><tspan x="640" dy="32" fill="#FFFFFF" font-size="16">件事。独自坐在房间里，对着墙上的荧幕光影，用我的一生，把你的一生慢慢看完。</tspan></text>
</g></svg>