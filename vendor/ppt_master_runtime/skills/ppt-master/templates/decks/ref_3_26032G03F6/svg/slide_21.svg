<image href="../assets/image36.jpeg" x="51.2" y="70.4" width="350.4" height="391.87" preserveAspectRatio="none"/>
<rect x="51.2" y="70.4" width="350.4" height="391.87" fill="none" stroke="none" stroke-width="1"/>
