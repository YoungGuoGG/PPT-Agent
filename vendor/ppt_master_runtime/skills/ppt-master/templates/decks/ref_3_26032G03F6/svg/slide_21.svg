<g id="shape-8" data-name="文本框 7">
<rect x="51.2" y="485.07" width="588.8" height="135.67" fill="none"/>
<text x="60.8" y="508" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">有时候我希望你的一生能被拍成一部漫长的电影。然后让我</tspan><tspan x="60.8" dy="36.27" fill="#000000" font-size="21.33">比你晚出生一百年，一辈子只做一件事。独自坐在房间里，</tspan><tspan x="60.8" dy="36.27" fill="#000000" font-size="21.33">对着墙上的荧幕光影，用我的一生，把你的一生慢慢看完。</tspan></text>
</g>
<g id="shape-7" data-name="文本框 6">
<rect x="676" y="70.4" width="524.8" height="436.13" fill="none"/>
<text x="685.6" y="93.33" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">他的神情、他的声音、</tspan></text>
<text x="685.6" y="125.33" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">他衣角一条蜿蜒的纹路，</tspan></text>
<text x="685.6" y="157.33" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">他一切的一切，都足以回味千百遍，</tspan></text>
<text x="685.6" y="189.33" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">在黑暗或光明的河流里千缠百绕，</tspan></text>
<text x="685.6" y="221.33" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">长出花叶参天。</tspan></text>
<text x="685.6" y="253.33" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">或有樵夫看尽了枯荣，问为什么爱呢？</tspan></text>
<text x="685.6" y="285.33" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">可是在遥远的人之初，</tspan></text>
<text x="685.6" y="317.33" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">第一次心跳加速，</tspan></text>
<text x="685.6" y="349.33" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">第一次手足无措，</tspan></text>
<text x="685.6" y="381.33" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">第一次相思无从。</tspan></text>
<text x="685.6" y="413.33" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">谁又能说得清，为什么爱呢？</tspan></text>
</g>
<g id="shape-9" data-name="文本框 8">
<rect x="686.4" y="555.7" width="504" height="67.73" fill="none"/>
<text x="696" y="601.3" text-anchor="start" xml:space="preserve" font-family="&quot;思源宋体 CN Heavy&quot;, sans-serif" font-size="48" fill="#000000"><tspan fill="#000000" font-size="48">三月桃花</tspan><tspan fill="#000000" font-size="48">   若长良川</tspan></text>
</g>
