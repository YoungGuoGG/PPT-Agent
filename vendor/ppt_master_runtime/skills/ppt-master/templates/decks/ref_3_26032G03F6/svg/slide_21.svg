<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720"><g id="shape-3" data-name="矩形 2">
<rect x="1057" y="506.53" width="119.8" height="119.8" fill="#B69B77" stroke="none" stroke-width="1"/>
</g>
