<text x="1076.7" y="119.67" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">花</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">开</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">得</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">太</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">好</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">，</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">所</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">以</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">摇</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">摇</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">欲</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">坠</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">。</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">这</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">一</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">切</tspan><tspan x="1076.7" dy="22.4" fill="#FFFFFF" font-size="21.33">的</tspan></text>
