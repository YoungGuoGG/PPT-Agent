<text x="73.47" y="132.27" text-anchor="start" xml:space="preserve" font-family="&quot;思源宋体 CN Heavy&quot;, sans-serif" font-size="42.67" fill="#000000"><tspan fill="#000000" font-size="42.67">三月桃花，两人一马</tspan></text>
</g>
<g id="shape-16" data-name="文本框 15">
<rect x="83.07" y="210.6" width="312" height="397.33" fill="none"/>
<text x="92.67" y="233.53" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">如何让你遇见我</tspan></text>
<text x="92.67" y="265.53" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">在我最美丽的时刻</tspan></text>
<text x="92.67" y="297.53" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">为这 我已在佛前 求了五百年</tspan></text>
<text x="92.67" y="329.53" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">求他让我们结一段尘缘</tspan></text>
<text x="92.67" y="361.53" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">佛于是把我化作一棵树</tspan></text>
<text x="92.67" y="393.53" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">长在你必经的路旁</tspan></text>
<text x="92.67" y="425.53" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">阳光下慎重地开满了花</tspan></text>
<text x="92.67" y="457.53" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">朵朵都是我前世的盼望</tspan></text>
<text x="92.67" y="489.53" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">当你走近 请你细听</tspan></text>
<text x="92.67" y="521.53" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">那颤抖的叶是我等待的热情</tspan></text>
</g>
