<g id="shape-15" data-name="文本框 14">
<rect x="640" y="547.4" width="582.4" height="106.77" fill="none"/>
<text x="649.6" y="568.07" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000"><tspan fill="#000000" font-size="18.67">有时候我希望你的一生能被拍成一部漫长的电影，</tspan></text>
<text x="649.6" y="596.07" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000"><tspan fill="#000000" font-size="18.67">然后让我比你晚出生一百年，一辈子只做一件事，独自坐在房间里，</tspan></text>
<text x="649.6" y="624.07" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000"><tspan fill="#000000" font-size="18.67">对着墙上的荧幕光影，用我的一生，把你的一生慢慢看完。</tspan></text>
</g>
