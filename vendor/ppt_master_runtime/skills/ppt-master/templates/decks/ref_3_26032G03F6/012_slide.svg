<g id="shape-13" data-name="文本框 12">
<rect x="59.93" y="174.8" width="898.73" height="119.92" fill="none"/>
<text x="69.53" y="195.47" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000"><tspan fill="#000000" font-size="18.67">他的神情、他的声音、他衣角一条蜿蜒的纹路，他一切的一切，都足以回味千百遍，在黑暗或光明的河流里</tspan><tspan x="69.53" dy="31.73" fill="#000000" font-size="18.67">千缠百绕，长出花叶参天。或有樵夫看尽了枯荣，问为什么爱呢？可是在遥远的人之初，第一次心跳加速，</tspan><tspan x="69.53" dy="31.73" fill="#000000" font-size="18.67">第一次手足无措，第一次相思无从。谁又能说得清，为什么爱呢？</tspan></text>
</g>
