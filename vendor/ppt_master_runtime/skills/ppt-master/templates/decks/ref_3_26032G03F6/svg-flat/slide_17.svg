<g id="shape-14" data-name="文本框 13">
<rect x="375.73" y="82.13" width="206.33" height="146.61" fill="none"/>
<text x="478.9" y="123.2" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="42.67" fill="#000000"><tspan fill="#000000" font-size="42.67">三月桃花</tspan></text>
<text x="478.9" y="182.93" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="42.67" fill="#000000"><tspan fill="#000000" font-size="42.67">两人一马</tspan></text>
</g>
<g id="shape-16" data-name="文本框 15">
<rect x="343.33" y="285.67" width="271.2" height="373.07" fill="none"/>
<text x="352.93" y="307.47" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">如何让你遇见我</tspan></text>
<text x="352.93" y="337.47" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">在我最美丽的时刻</tspan></text>
<text x="352.93" y="367.47" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">为这 我已在佛前 求了五百年</tspan></text>
<text x="352.93" y="397.47" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">求他让我们结一段尘缘</tspan></text>
<text x="352.93" y="427.47" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">佛于是把我化作一棵树</tspan></text>
<text x="352.93" y="457.47" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">长在你必经的路旁</tspan></text>
<text x="352.93" y="487.47" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">阳光下慎重地开满了花</tspan></text>
<text x="352.93" y="517.47" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">朵朵都是我前世的盼望</tspan></text>
<text x="352.93" y="547.47" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">当你走近 请你细听</tspan></text>
<text x="352.93" y="577.47" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">那颤抖的叶是我等待的热情</tspan></text>
</g></svg>