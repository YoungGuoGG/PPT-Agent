<g id="shape-11" data-name="文本框 10">
<rect x="216.8" y="200.2" width="361.6" height="319.8" fill="none"/>
<text x="226.4" y="223.13" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">如何让你遇见我</tspan></text>
<text x="226.4" y="255.13" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">在我最美丽的时刻</tspan></text>
<text x="226.4" y="287.13" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">为这 我已在佛前 求了五百年</tspan></text>
<text x="226.4" y="319.13" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">求他让我们结一段尘缘</tspan></text>
<text x="226.4" y="351.13" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">佛于是把我化作一棵树</tspan></text>
<text x="226.4" y="383.13" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">长在你必经的路旁</tspan></text>
<text x="226.4" y="415.13" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">阳光下慎重地开满了花</tspan></text>
<text x="226.4" y="447.13" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">朵朵都是我前世的盼望</tspan></text>
</g>
