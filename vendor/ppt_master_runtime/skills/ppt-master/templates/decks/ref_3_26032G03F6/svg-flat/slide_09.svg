<g id="shape-13" data-name="文本框 12">
<rect x="146.17" y="137.05" width="454.73" height="471.12" fill="none"/>
<text x="591.3" y="157.72" text-anchor="end" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="18.67">他的神情、他的声音、他衣角一条蜿蜒的纹路，他一</tspan><tspan x="591.3" dy="31.73" fill="#FFFFFF" font-size="18.67">切的一切，都足以回味千百遍，在黑暗或光明的河流</tspan><tspan x="591.3" dy="31.73" fill="#FFFFFF" font-size="18.67">里千缠百绕，长出花叶参天。或有樵夫看尽了枯荣，</tspan><tspan x="591.3" dy="31.73" fill="#FFFFFF" font-size="18.67">问为什么爱呢？可是在遥远的人之初，第一次心跳加</tspan><tspan x="591.3" dy="31.73" fill="#FFFFFF" font-size="18.67">速，第一次手足无措，第一次相思无从。谁又能说得</tspan><tspan x="591.3" dy="31.73" fill="#FFFFFF" font-size="18.67">清，为什么爱呢？</tspan></text>
<text x="591.3" y="348.12" text-anchor="end" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="18.67">他的神情、他的声音、他衣角一条蜿蜒的纹路，他一</tspan><tspan x="591.3" dy="31.73" fill="#FFFFFF" font-size="18.67">切的一切，都足以回味千百遍，在黑暗或光明的河流</tspan><tspan x="591.3" dy="31.73" fill="#FFFFFF" font-size="18.67">里千缠百绕，长出花叶参天。或有樵夫看尽了枯荣，</tspan><tspan x="591.3" dy="31.73" fill="#FFFFFF" font-size="18.67">问为什么爱呢？可是在遥远的人之初，第一次心跳加</tspan><tspan x="591.3" dy="31.73" fill="#FFFFFF" font-size="18.67">速，第一次手足无措，第一次相思无从。谁又能说得</tspan><tspan x="591.3" dy="31.73" fill="#FFFFFF" font-size="18.67">清，为什么爱呢？</tspan></text>
</g>
