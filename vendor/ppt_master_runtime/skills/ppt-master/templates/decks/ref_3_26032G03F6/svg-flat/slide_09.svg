<text x="693.32" y="260.07" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="72" fill="#000000"><tspan fill="#000000" font-size="72">若</tspan><tspan x="693.32" dy="75.6" fill="#000000" font-size="72">长</tspan><tspan x="693.32" dy="75.6" fill="#000000" font-size="72">良</tspan><tspan x="693.32" dy="75.6" fill="#000000" font-size="72">川</tspan></text>
