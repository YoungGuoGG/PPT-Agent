<g id="shape-8" data-name="文本框 7">
<rect x="276" y="251.4" width="372.87" height="409.47" fill="none"/>
<text x="285.6" y="273.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">他的神情、他的声音、</tspan></text>
<text x="285.6" y="303.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">他衣角一条蜿蜒的纹路，</tspan></text>
<text x="285.6" y="333.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">他一切的一切，都足以回味千百遍，</tspan></text>
<text x="285.6" y="363.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">在黑暗或光明的河流里千缠百绕，</tspan></text>
<text x="285.6" y="393.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">长出花叶参天。</tspan></text>
<text x="285.6" y="423.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">或有樵夫看尽了枯荣，问为什么爱呢？</tspan></text>
<text x="285.6" y="453.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">可是在遥远的人之初，</tspan></text>
<text x="285.6" y="483.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">第一次心跳加速，</tspan></text>
<text x="285.6" y="513.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">第一次手足无措，</tspan></text>
<text x="285.6" y="543.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">第一次相思无从。</tspan></text>
<text x="285.6" y="573.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#000000"><tspan fill="#000000" font-size="20">谁又能说得清，为什么爱呢？</tspan></text>
</g>
