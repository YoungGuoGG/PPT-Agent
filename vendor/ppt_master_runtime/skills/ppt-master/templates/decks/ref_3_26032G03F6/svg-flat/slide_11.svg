<text x="203.42" y="65.8" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="37.33" fill="#B69B77"><tspan fill="#B69B77" font-size="37.33">三</tspan><tspan x="203.42" dy="39.2" fill="#B69B77" font-size="37.33">月</tspan><tspan x="203.42" dy="39.2" fill="#B69B77" font-size="37.33">桃</tspan><tspan x="203.42" dy="39.2" fill="#B69B77" font-size="37.33">花</tspan><tspan x="203.42" dy="39.2" fill="#B69B77" font-size="37.33">，</tspan><tspan x="203.42" dy="39.2" fill="#B69B77" font-size="37.33">两</tspan><tspan x="203.42" dy="39.2" fill="#B69B77" font-size="37.33">人</tspan><tspan x="203.42" dy="39.2" fill="#B69B77" font-size="37.33">一</tspan><tspan x="203.42" dy="39.2" fill="#B69B77" font-size="37.33">马</tspan></text>
