<g id="shape-15" data-name="文本框 14">
<rect x="639.4" y="247.47" width="507.2" height="203.47" fill="none"/>
<text x="649" y="270.4" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">有时候我希望你的一生能被拍成一部漫长的电影，</tspan></text>
<text x="649" y="302.4" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">然后让我比你晚出生一百年</tspan><tspan fill="#000000" font-size="21.33">,</tspan></text>
<text x="649" y="334.4" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">一辈子只做一件事，独自坐在房间里，</tspan></text>
<text x="649" y="366.4" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">对着墙上的荧幕光影，用我的一生</tspan><tspan fill="#FFFFFF" font-size="21.33">,</tspan></text>
<text x="649" y="398.4" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">把你的一生慢慢看完。</tspan></text>
</g>
<g id="shape-13" data-name="文本框 12">
<rect x="52.53" y="367.53" width="515.73" height="272.93" fill="none"/>
<text x="62.13" y="390.47" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">他的神情、他的声音、他衣角一条蜿蜒的纹路，他一</tspan><tspan x="62.13" dy="36.27" fill="#000000" font-size="21.33">切的一切，都足以回味千百遍，在黑暗或光明的河流</tspan><tspan x="62.13" dy="36.27" fill="#000000" font-size="21.33">里千缠百绕，长出花叶参天。或有樵夫看尽了枯荣，</tspan><tspan x="62.13" dy="36.27" fill="#000000" font-size="21.33">问为什么爱呢？可是在遥远的人之初，第一次心跳加</tspan><tspan x="62.13" dy="36.27" fill="#000000" font-size="21.33">速，第一次手足无措，第一次相思无从。谁又能说得</tspan><tspan x="62.13" dy="36.27" fill="#000000" font-size="21.33">清，为什么爱呢？</tspan></text>
</g>
<g id="shape-11" data-name="文本框 10">
<rect x="52.53" y="139.87" width="612.37" height="80.78" fill="none"/>
<text x="62.13" y="194.53" text-anchor="start" xml:space="preserve" font-family="&quot;思源宋体 CN Heavy&quot;, sans-serif" font-size="58.67" fill="#000000"><tspan fill="#000000" font-size="58.67">三月桃花，两人一马</tspan></text>
</g></svg>