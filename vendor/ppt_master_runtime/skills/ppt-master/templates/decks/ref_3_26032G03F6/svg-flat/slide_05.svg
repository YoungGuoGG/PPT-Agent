<g id="shape-10" data-name="文本框 9">
<rect x="358.87" y="377.07" width="844.87" height="201.73" fill="none"/>
<text x="368.47" y="397.73" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000"><tspan fill="#000000" font-size="18.67">他的神情、他的声音、他衣角一条蜿蜒的纹路，他一切的一切，都足以回味千百遍，在黑暗或光明的</tspan><tspan x="368.47" dy="31.73" fill="#000000" font-size="18.67">河流里千缠百绕，长出花叶参天。或有樵夫看尽了枯荣，问为什么爱呢？可是在遥远的人之初，第一</tspan><tspan x="368.47" dy="31.73" fill="#000000" font-size="18.67">次心跳加速，第一次手足无措，第一次相思无从。谁又能说得清，为什么爱呢？</tspan></text>
<text x="368.47" y="492.93" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="18.67" fill="#000000"><tspan fill="#000000" font-size="18.67">有时候我希望你的一生能被拍成一部漫长的电影。然后让我比你晚出生一百年，一辈子只做一件事。</tspan><tspan x="368.47" dy="31.73" fill="#000000" font-size="18.67">独自坐在房间里，对着墙上的荧幕光影，用我的一生，把你的一生慢慢看完。</tspan></text>
</g>
<g id="shape-6" data-name="文本框 5">
<rect x="358.87" y="228.2" width="593.2" height="80.67" fill="none"/>
<text x="368.47" y="282.87" text-anchor="start" xml:space="preserve" font-family="&quot;思源宋体 CN Heavy&quot;, sans-serif" font-size="58.67" fill="#000000"><tspan fill="#000000" font-size="58.67">三月桃花，</tspan><tspan fill="#000000" font-size="58.67">若长良川</tspan></text>
</g>
