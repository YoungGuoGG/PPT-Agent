<g id="shape-9" data-name="矩形 8">
<rect x="67.29" y="217.24" width="537.66" height="125.08" fill="none"/>
<text x="76.89" y="237.9" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">盐水鸭是南京著名的特产，属金陵菜，是金陵菜的代表之一，</tspan><tspan x="76.89" dy="24.27" fill="#262626" font-size="18.67">又叫桂花鸭，是中国地理标志产品。因南京有“金陵”别称，故</tspan><tspan x="76.89" dy="24.27" fill="#262626" font-size="18.67">也称“金陵盐水鸭”，久负盛名，至今已有两千五百多年历史</tspan></text>
</g>
<g id="shape-10" data-name="矩形 9">
<rect x="67.29" y="379.05" width="537.66" height="95.87" fill="none"/>
<text x="76.89" y="399.71" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="18.67">南京盐水鸭制作历史悠久，积累了丰富的制作经验。鸭皮白肉</tspan><tspan x="76.89" dy="24.27" fill="#FFFFFF" font-size="18.67">嫩、肥而不腻、香鲜味美，具有香、酥、嫩的特点。而以中秋</tspan><tspan x="76.89" dy="24.27" fill="#FFFFFF" font-size="18.67">前后，桂花盛开季节制作的盐水鸭色味最佳，名为桂花鸭。</tspan></text>
</g>
<g id="shape-11" data-name="矩形 10">
<rect x="67.29" y="540.85" width="537.66" height="125.27" fill="none"/>
<text x="76.89" y="561.52" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">盐水鸭最能体现鸭子的本味，做法返璞归真，滤油腻、驱腥臊</tspan><tspan x="76.89" dy="24.27" fill="#262626" font-size="18.67">、留鲜美、驻肥嫩，常吃盐水鸭还能抗炎消肿拒衰老，心血管</tspan><tspan x="76.89" dy="24.27" fill="#262626" font-size="18.67">病患者尤适宜 。2020年7月20日，南京盐水鸭入选中欧地理标</tspan><tspan x="76.89" dy="24.27" fill="#262626" font-size="18.67">志首批保护清单 。</tspan></text>
</g>
