<g id="shape-8" data-name="矩形 7">
<rect x="85.33" y="575.08" width="1109.33" height="95.64" fill="none"/>
<text x="640" y="595.75" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626" letter-spacing="26.67"><tspan fill="#262626" font-size="18.67" letter-spacing="26.67">从1970年至1993年，先后接待100多个国家和地区的国家元首、政府首脑及600多个外国代表团，来此观览的国内外游客更是难以计数</tspan><tspan x="640" dy="24.27" fill="#262626" font-size="18.67" letter-spacing="26.67">。 </tspan><tspan fill="#262626" font-size="18.67" letter-spacing="26.67">1</tspan><tspan fill="#262626" font-size="18.67" letter-spacing="26.67">960年以“世界最长的公铁两用桥”被载入《吉尼斯世界纪录大全》，2014年7月入选不可移动文物，2016年9月入选首批中国20世</tspan><tspan x="640" dy="24.27" fill="#262626" font-size="18.67" letter-spacing="26.67">纪建筑遗产名录。 2023年9月，南京长江大桥经南京市人民政府批准列入第五批南京市文物保护单位名单</tspan></text>
</g>
