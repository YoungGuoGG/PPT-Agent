<g id="shape-9" data-name="矩形 8">
<rect x="675.81" y="230.52" width="532.57" height="89.65" fill="none"/>
<text x="685.41" y="251.19" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">南京博物院（免费开放时间：周一闭馆/周二至周日9：00－</tspan><tspan x="685.41" dy="22.4" fill="#262626" font-size="18.67">17：00）位于江苏省南京市玄武区中山东路321号，是江苏省文</tspan><tspan x="685.41" dy="22.4" fill="#262626" font-size="18.67">化和旅游厅直属副厅级事业单位</tspan></text>
</g>
<g id="shape-17" data-name="矩形 16">
<rect x="675.81" y="372.24" width="532.57" height="89.65" fill="none"/>
<text x="685.41" y="392.9" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">中国三大博物馆之一，简称南院或南博，其前身是民国二十二</tspan><tspan x="685.41" dy="22.4" fill="#262626" font-size="18.67">年（1933年）蔡元培等倡建的国立中央博物院，是中国创建最</tspan><tspan x="685.41" dy="22.4" fill="#262626" font-size="18.67">早的博物馆、中国第一座由国家投资兴建的大型综合类博物馆</tspan></text>
</g>
<g id="shape-18" data-name="矩形 17">
<rect x="675.81" y="513.95" width="532.57" height="89.65" fill="none"/>
<text x="685.41" y="534.62" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">现为大型综合性的国家级博物馆、首批国家一级博物馆 、首批</tspan><tspan x="685.41" dy="22.4" fill="#262626" font-size="18.67">中央地方共建国家级博物馆 、国家AAAA级旅游景区、全国重点</tspan><tspan x="685.41" dy="22.4" fill="#262626" font-size="18.67">文物保护单位和中国20世纪建筑遗产</tspan></text>
</g></svg>