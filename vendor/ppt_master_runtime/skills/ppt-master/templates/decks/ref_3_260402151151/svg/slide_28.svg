<g id="shape-11-text" data-name="文本框 10 text">
<text x="206.27" y="194.51" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#262626"><tspan fill="#262626" font-size="21.33">龙</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">袍</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">蟹</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">黄</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">汤</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">包</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">是</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">江</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">苏</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">省</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">的</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">一</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">道</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">传</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">统</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">小</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">吃</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">，</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">属</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">于</tspan><tspan x="206.27" dy="22.4" fill="#262626" font-size="21.33">苏</tspan></text>
</g>
