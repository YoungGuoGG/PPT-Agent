<g id="shape-13" data-name="文本框 12">
<rect x="687.1" y="286.54" width="470.67" height="242.59" fill="none"/>
<text x="696.7" y="309.48" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">龙袍蟹黄汤包的制作原料十分讲究，馅为蟹黄和</tspan><tspan x="696.7" dy="27.73" fill="#FFFFFF" font-size="21.33">蟹肉，汤为原味鸡汤，制作工艺精妙绝伦，在南</tspan><tspan x="696.7" dy="27.73" fill="#FFFFFF" font-size="21.33">京六合常年举办龙袍蟹黄汤包节，盛况空前享誉</tspan><tspan x="696.7" dy="27.73" fill="#FFFFFF" font-size="21.33">海内外。龙袍蟹黄汤包是以母螯蟹的蟹肉、蟹黄</tspan><tspan x="696.7" dy="27.73" fill="#FFFFFF" font-size="21.33">，新鲜猪肉为主料加以鸡汤、多种调味品制成馅</tspan><tspan x="696.7" dy="27.73" fill="#FFFFFF" font-size="21.33">料，再用面皮包制而成，具有皮薄馅大，汤汁浓</tspan><tspan x="696.7" dy="27.73" fill="#FFFFFF" font-size="21.33">厚，味道鲜美的特征，深受广大美食爱好者的喜</tspan><tspan x="696.7" dy="27.73" fill="#FFFFFF" font-size="21.33">爱。</tspan></text>
</g></svg>