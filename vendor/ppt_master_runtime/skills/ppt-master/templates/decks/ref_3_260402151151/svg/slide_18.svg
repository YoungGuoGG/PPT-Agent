<g id="shape-21" data-name="矩形 20">
<rect x="692.26" y="226.1" width="517.65" height="183.89" fill="none"/>
<text x="951.08" y="246.77" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">【主词条：南京话】南京大部分地区通行南京官话，高淳区</tspan><tspan x="951.08" dy="24.27" fill="#262626" font-size="18.67">大部、溧水区南部地区的方言则通行吴方言。比如：来斯（</tspan><tspan x="951.08" dy="24.27" fill="#262626" font-size="18.67">lai</tspan><tspan fill="#262626" font-size="18.67"> </tspan><tspan fill="#262626" font-size="18.67">si）</tspan><tspan fill="#262626" font-size="18.67">——</tspan><tspan fill="#262626" font-size="18.67">有本事，好:XXX的新手机很来斯，南京话在历史上</tspan><tspan x="951.08" dy="24.27" fill="#262626" font-size="18.67">长期是中国的官方语言，六朝以前，南京地区通行吴地方言</tspan><tspan x="951.08" dy="24.27" fill="#262626" font-size="18.67">。东晋衣冠南渡，中原士族大批南迁并将中原雅音带至南京</tspan></text>
</g>
<g id="shape-24" data-name="矩形 23">
<rect x="692.26" y="448.83" width="517.65" height="184.08" fill="none"/>
<text x="951.08" y="469.5" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">融合部分本地语音形成士族的金陵雅音，成为中古汉语音系</tspan><tspan x="951.08" dy="24.27" fill="#262626" font-size="18.67">的代表音，其影响远及日本，如今日文汉字读音的“吴音”即</tspan><tspan x="951.08" dy="24.27" fill="#262626" font-size="18.67">源于此。金陵雅言以古中原雅言正统嫡传的身份被确立为中</tspan><tspan x="951.08" dy="24.27" fill="#262626" font-size="18.67">国汉语的标准音，并深远地影响到直至今天的中国语言形态</tspan><tspan x="951.08" dy="24.27" fill="#262626" font-size="18.67">，加之六朝以来汉人文化上的优越意识，清代中叶之前历朝</tspan><tspan x="951.08" dy="24.27" fill="#262626" font-size="18.67">的中国官方标准语均以南京官话为标准</tspan></text>
</g>
