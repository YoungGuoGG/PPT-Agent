<g id="shape-14" data-name="矩形 13">
<rect x="666.15" y="214.19" width="523.95" height="95.87" fill="none"/>
<text x="675.75" y="234.86" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">周边国家如日本、朝鲜、越南所传授和使用的中国语也都是南</tspan><tspan x="675.75" dy="24.27" fill="#262626" font-size="18.67">京官话。明清时期来华的西方传教士所流行的是以南京官话为</tspan><tspan x="675.75" dy="24.27" fill="#262626" font-size="18.67">标准的中国话</tspan></text>
</g>
<g id="shape-17" data-name="矩形 16">
<rect x="666.15" y="376" width="523.95" height="95.87" fill="none"/>
<text x="675.75" y="396.66" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="18.67">明朝传教士麦嘉湖称官话以“南京腔为各腔主脑” 永乐迁都北</tspan><tspan x="675.75" dy="24.27" fill="#FFFFFF" font-size="18.67">京时，南京官话随着大量人口迁入北京从而影响并改变了北京</tspan><tspan x="675.75" dy="24.27" fill="#FFFFFF" font-size="18.67">方言，形成北京官话及现代普通话的雏型</tspan></text>
</g>
<g id="shape-20" data-name="矩形 19">
<rect x="666.15" y="537.81" width="523.95" height="95.87" fill="none"/>
<text x="675.75" y="558.47" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">民国初年西方传教士主持的“华语正音会”，也以南京音为标</tspan><tspan x="675.75" dy="24.27" fill="#262626" font-size="18.67">准。长久以来，南京话以其清雅流畅、抑扬顿挫的特点以及独</tspan><tspan x="675.75" dy="24.27" fill="#262626" font-size="18.67">特的地位而受到推崇</tspan></text>
</g>
