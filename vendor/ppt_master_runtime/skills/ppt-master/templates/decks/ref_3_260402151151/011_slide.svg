<g id="shape-12" data-name="文本框 11">
<rect x="103.53" y="251.3" width="486.18" height="154.68" fill="none"/>
<text x="113.13" y="271.97" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#595959" font-weight="bold"><tspan fill="#595959" font-size="18.67" font-weight="bold">开放时间：9:00-17:30 </tspan><tspan fill="#595959" font-size="18.67" font-weight="bold">    </tspan><tspan fill="#595959" font-size="18.67" font-weight="bold">门票价格：90元/人</tspan><tspan fill="#595959" font-size="18.67">位于南京</tspan><tspan x="113.13" dy="24.27" fill="#595959" font-size="18.67">市秦淮区中华门外，是中国历史上最为悠久的佛教寺庙，</tspan><tspan x="113.13" dy="24.27" fill="#595959" font-size="18.67">其前身是东吴赤乌年间（238─250年）建造的建初寺及阿</tspan><tspan x="113.13" dy="24.27" fill="#595959" font-size="18.67">育王塔，是继洛阳白马寺之后中国的第二座寺庙，也是中</tspan><tspan x="113.13" dy="24.27" fill="#595959" font-size="18.67">国南方建立的第一座佛寺</tspan></text>
</g>
