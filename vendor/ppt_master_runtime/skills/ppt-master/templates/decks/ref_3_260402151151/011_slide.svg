</g>
<g id="shape-17" data-name="文本框 16">
<rect x="103.53" y="494.15" width="486.18" height="154.68" fill="none"/>
<text x="113.13" y="514.82" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#595959"><tspan fill="#595959" font-size="18.67">中国的佛教中心，与灵谷寺、天界寺并称为金陵三大寺，</tspan><tspan x="113.13" dy="24.27" fill="#595959" font-size="18.67">下辖百寺。大报恩寺是明成祖朱棣为纪念明太祖朱元璋和</tspan><tspan x="113.13" dy="24.27" fill="#595959" font-size="18.67">马皇后而建，明永乐十年（1412年）于建初寺原址重建，</tspan><tspan x="113.13" dy="24.27" fill="#595959" font-size="18.67">历时达19年，耗费248.5万两白银，十万军役、民夫。大</tspan><tspan x="113.13" dy="24.27" fill="#595959" font-size="18.67">报恩寺施工极其考究</tspan></text>
</g></svg>