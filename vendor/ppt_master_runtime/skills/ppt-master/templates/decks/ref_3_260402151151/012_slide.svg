<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<g id="shape-2" data-name="文本框 1">
<rect x="92.95" y="187.75" width="1094.1" height="108.17" fill="none"/>
<text x="640" y="210.68" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#262626"><tspan fill="#262626" font-size="21.33">完全按照皇宫的标准来营建，金碧辉煌，昼夜通明。整个寺院规模极其宏大，有殿阁30多座、僧院148间、廊房</tspan><tspan x="640" dy="27.73" fill="#262626" font-size="21.33">118间、经房38间，是中国历史上规模最大、规格最高的寺院，为百寺之首。2011年，评为“2010年度全国十大考古</tspan><tspan x="640" dy="27.73" fill="#262626" font-size="21.33">新发现” 。2013年，被国务院核定公布为全国重点文物保护单位。2015年底，大报恩寺遗址公园正式开放。</tspan></text>
</g>
