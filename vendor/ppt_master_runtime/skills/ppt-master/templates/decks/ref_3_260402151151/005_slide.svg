<g id="shape-10" data-name="文本框 9">
<rect x="44.19" y="498.76" width="1191.62" height="141.78" fill="none"/>
<text x="640" y="521.7" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#262626"><tspan fill="#262626" font-size="21.33">南京是首批国家历史文化名城 ，中华文明的重要发祥地，长期是中国南方的政治、经济、文化中心，历史上曾数次庇佑华夏</tspan><tspan x="640" dy="27.73" fill="#262626" font-size="21.33">之正朔。南京早在100-120万年前就有古人类活动，35-60万年前已有南京猿人在汤山生活，有着7000多年文明史和近500年的</tspan><tspan x="640" dy="27.73" fill="#262626" font-size="21.33">建都史，西街遗址的发掘将南京建城史追溯到3100年前的西周时期。南京是国家重要的科教中心，自古以来就是一座崇文重教</tspan><tspan x="640" dy="27.73" fill="#262626" font-size="21.33">的城市，有“天下文枢”“东南第一学”之称，明清中国一半以上的状元均出自南京江南贡院。</tspan></text>
</g>
