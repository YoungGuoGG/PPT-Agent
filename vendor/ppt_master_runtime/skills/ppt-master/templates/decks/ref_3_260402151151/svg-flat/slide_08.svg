<g id="shape-14" data-name="矩形 13">
<rect x="46.93" y="235.63" width="420.88" height="171.07" fill="none"/>
<text x="257.37" y="256.29" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">明孝陵（开放时间：2月-11月6:30—18:30，</tspan><tspan fill="#262626" font-size="18.67"> </tspan><tspan fill="#262626" font-size="18.67">12月</tspan><tspan x="257.37" dy="22.4" fill="#262626" font-size="18.67">-1月7:00—17:30 </tspan><tspan fill="#262626" font-size="18.67">  </tspan><tspan fill="#262626" font-size="18.67">门票价格：70元），位于江苏</tspan><tspan x="257.37" dy="22.4" fill="#262626" font-size="18.67">省南京市玄武区紫金山南麓独龙阜玩珠峰下，东</tspan><tspan x="257.37" dy="22.4" fill="#262626" font-size="18.67">毗中山陵，南临梅花山，位于钟山风景名胜区内</tspan><tspan x="257.37" dy="22.4" fill="#262626" font-size="18.67">，是明太祖朱元璋与其皇后的合葬陵寝。因皇后</tspan><tspan x="257.37" dy="22.4" fill="#262626" font-size="18.67">马氏谥号“孝慈高皇后”</tspan></text>
</g>
<g id="shape-17" data-name="矩形 16">
<rect x="46.93" y="459.88" width="420.88" height="171.07" fill="none"/>
<text x="257.37" y="480.55" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">又因奉行孝治天下，故名“孝陵”。其占地面积达</tspan><tspan x="257.37" dy="22.4" fill="#262626" font-size="18.67">170余万平方米，是中国规模最大的帝王陵寝之一</tspan><tspan x="257.37" dy="22.4" fill="#262626" font-size="18.67"> 。明孝陵作为中国明清皇陵之首，代表了明初建</tspan><tspan x="257.37" dy="22.4" fill="#262626" font-size="18.67">筑和石刻艺术的最高成就，直接影响明清两代五</tspan><tspan x="257.37" dy="22.4" fill="#262626" font-size="18.67">百余年20多座帝王陵寝的形制，依历史进程分布</tspan><tspan x="257.37" dy="22.4" fill="#262626" font-size="18.67">于北京、湖北、辽宁</tspan></text>
</g>
