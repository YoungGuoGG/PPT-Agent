<g id="shape-11" data-name="矩形 10">
<rect x="232.57" y="473.01" width="928.57" height="175.17" fill="none"/>
<text x="242.17" y="495.94" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#333333"><tspan fill="#333333" font-size="21.33">桂花糖芋苗是南京的著名传统甜点，属金陵菜、金陵小吃，和桂花蜜汁藕、梅花糕、赤豆酒酿小</tspan><tspan x="242.17" dy="27.73" fill="#333333" font-size="21.33">圆子一同被誉为金陵南京四大最有人情味街头小食。光洁的芋苗口感润滑爽口、香甜酥软，汤汁</tspan><tspan x="242.17" dy="27.73" fill="#333333" font-size="21.33">呈酱红色鲜亮诱人，散发着浓郁的桂花香，吃后唇齿留香。选用新鲜芋苗，蒸熟后剥皮；加上特</tspan><tspan x="242.17" dy="27.73" fill="#333333" font-size="21.33">制的桂花糖浆，放在大锅里慢慢熬制。煮的时候要放一点口碱，这样芋苗煮才会煮出红彤彤、诱</tspan><tspan x="242.17" dy="27.73" fill="#333333" font-size="21.33">人的颜色。</tspan></text>
</g>
