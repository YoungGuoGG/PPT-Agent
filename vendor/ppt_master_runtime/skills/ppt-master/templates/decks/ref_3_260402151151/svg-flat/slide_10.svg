<g id="shape-10" data-name="文本框 9">
<rect x="64.46" y="202.02" width="353.64" height="184.08" fill="none"/>
<text x="408.5" y="222.69" text-anchor="end" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626" font-weight="bold"><tspan fill="#262626" font-size="18.67" font-weight="bold">中山陵（免费开放时间8:30-17:00，周</tspan><tspan x="408.5" dy="24.27" fill="#262626" font-size="18.67" font-weight="bold">一闭馆维护）</tspan><tspan fill="#262626" font-size="18.67">位于江苏省南京市玄武区</tspan><tspan x="408.5" dy="24.27" fill="#262626" font-size="18.67">紫金山南麓钟山风景名胜区内，是中国</tspan><tspan x="408.5" dy="24.27" fill="#262626" font-size="18.67">近代伟大的民主革命先行者孙中山先生</tspan><tspan x="408.5" dy="24.27" fill="#262626" font-size="18.67">的陵寝及其附属纪念建筑群，陵寝面积</tspan><tspan x="408.5" dy="24.27" fill="#262626" font-size="18.67">8万余平方米</tspan></text>
</g>
<g id="shape-13" data-name="文本框 12">
<rect x="64.46" y="459.97" width="353.64" height="213.3" fill="none"/>
<text x="408.5" y="480.64" text-anchor="end" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">排列在一条中轴线上，体现了中国传统</tspan><tspan x="408.5" dy="24.27" fill="#262626" font-size="18.67">建筑的风格，从空中往下看，像一座平</tspan><tspan x="408.5" dy="24.27" fill="#262626" font-size="18.67">卧在绿绒毯上的“自由钟”。中山陵建筑</tspan><tspan x="408.5" dy="24.27" fill="#262626" font-size="18.67">融汇中国古代与西方建筑之精华，庄严</tspan><tspan x="408.5" dy="24.27" fill="#262626" font-size="18.67">简朴，别创新格。1961年，中山陵被国务</tspan><tspan x="408.5" dy="24.27" fill="#262626" font-size="18.67">院公布为第一批全国重点文物保护单位</tspan></text>
</g>
<g id="shape-17" data-name="文本框 16">
<rect x="854.24" y="200.7" width="353.64" height="184.08" fill="none"/>
<text x="863.84" y="221.36" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">于1926年春动工，至1929年夏建成。中山</tspan><tspan x="863.84" dy="24.27" fill="#262626" font-size="18.67">陵前临平川，背拥青嶂，东毗灵谷寺，</tspan><tspan x="863.84" dy="24.27" fill="#262626" font-size="18.67">西邻明孝陵，整个建筑群依山势而建，</tspan><tspan x="863.84" dy="24.27" fill="#262626" font-size="18.67">由南往北沿中轴线逐渐升高，主要建筑</tspan><tspan x="863.84" dy="24.27" fill="#262626" font-size="18.67">有博爱坊、墓道、陵门、石阶、碑亭、</tspan><tspan x="863.84" dy="24.27" fill="#262626" font-size="18.67">祭堂和墓室等</tspan></text>
</g>
<g id="shape-19" data-name="文本框 18">
<rect x="860.01" y="459.97" width="353.64" height="154.68" fill="none"/>
<text x="869.61" y="480.64" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">1982年，被列为国家级风景名胜区；</tspan><tspan x="869.61" dy="24.27" fill="#262626" font-size="18.67">1991年，被国家旅游局列为中国旅游胜地</tspan><tspan x="869.61" dy="24.27" fill="#262626" font-size="18.67">四十佳；2007年，被列为首批国家</tspan><tspan x="869.61" dy="24.27" fill="#262626" font-size="18.67">AAAAA级旅游景区；2016年，入选首批</tspan><tspan x="869.61" dy="24.27" fill="#262626" font-size="18.67">“中国20世纪建筑遗产”名录</tspan></text>
</g></svg>