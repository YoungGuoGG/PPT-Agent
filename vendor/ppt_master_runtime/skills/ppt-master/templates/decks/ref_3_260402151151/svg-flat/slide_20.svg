<g id="shape-19" data-name="矩形 18">
<rect x="287.49" y="232.34" width="503.37" height="95.87" fill="none"/>
<text x="297.09" y="253.01" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">民俗：南京主要的民俗活动有元宵灯会、清明踏青、端午</tspan><tspan x="297.09" dy="24.27" fill="#262626" font-size="18.67">节游秦淮、中秋圆月摸秋、重阳登高会、腊八节品粥、小</tspan><tspan x="297.09" dy="24.27" fill="#262626" font-size="18.67">年迎财神等。</tspan></text>
</g>
<g id="shape-22" data-name="矩形 21">
<rect x="287.49" y="362.31" width="503.37" height="153.85" fill="none"/>
<text x="297.09" y="382.97" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">舞蹈：南京的传统舞蹈有骆山大龙、东坝大马灯、麻雀蹦</tspan><tspan x="297.09" dy="24.27" fill="#262626" font-size="18.67">、江浦手狮、高淳跳五猖、湾北小马灯舞、栖霞舞龙、长</tspan><tspan x="297.09" dy="24.27" fill="#262626" font-size="18.67">芦抬龙、铜山高台狮子舞、东坝沛桥高跷、龙吟车、柘塘</tspan><tspan x="297.09" dy="24.27" fill="#262626" font-size="18.67">打社火、跳当当、打罗汉、竹镇高跷等，均为非物质文化</tspan><tspan x="297.09" dy="24.27" fill="#262626" font-size="18.67">遗产。</tspan></text>
</g>
<g id="shape-25" data-name="矩形 24">
<rect x="287.49" y="501.41" width="503.37" height="95.87" fill="none"/>
<text x="297.09" y="522.08" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">工艺：南京的工艺品种类繁多，有南京云锦、金陵金箔、</tspan><tspan x="297.09" dy="24.27" fill="#262626" font-size="18.67">南京绒花、雕花天鹅绒、南京仿古牙雕、金陵折扇、南京</tspan><tspan x="297.09" dy="24.27" fill="#262626" font-size="18.67">木雕、南京剪纸、金陵竹刻等 </tspan></text>
</g></svg>