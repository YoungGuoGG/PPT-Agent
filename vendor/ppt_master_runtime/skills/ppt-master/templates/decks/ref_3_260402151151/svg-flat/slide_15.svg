<g id="shape-21" data-name="矩形 20">
<rect x="635.75" y="475.8" width="529.96" height="125.27" fill="none"/>
<text x="900.73" y="496.47" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">是中国人民承载全民族灾难的实证性、遗址型专史纪念馆， 也</tspan><tspan x="900.73" dy="24.27" fill="#262626" font-size="18.67">是中国唯一一座有关侵华日军南京大屠杀的专史陈列馆及国家</tspan><tspan x="900.73" dy="24.27" fill="#262626" font-size="18.67">公祭日主办地。只有铭记南京大屠杀的历史，才能珍视和捍卫</tspan><tspan x="900.73" dy="24.27" fill="#262626" font-size="18.67">来之不易的和平。只有捍卫历史的真相，才能守护和平与正义</tspan></text>
</g>
<g id="shape-24" data-name="矩形 23">
<rect x="162.36" y="99.12" width="377.07" height="154.68" fill="none"/>
<text x="171.96" y="119.78" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="18.67">侵华日军南京大屠杀遇难同胞纪念馆（开放</tspan><tspan x="171.96" dy="24.27" fill="#FFFFFF" font-size="18.67">时间全年免费开放 周二至周日 08:30-</tspan><tspan x="171.96" dy="24.27" fill="#FFFFFF" font-size="18.67">17:30(最晚入园16:30) 周一 不开放；如遇</tspan><tspan x="171.96" dy="24.27" fill="#FFFFFF" font-size="18.67">法定节假日周一则正常开放）位于南京市建</tspan><tspan x="171.96" dy="24.27" fill="#FFFFFF" font-size="18.67">邺区水西门大街418号</tspan></text>
</g>
<g id="shape-27" data-name="矩形 26">
<rect x="162.36" y="298.07" width="377.07" height="125.27" fill="none"/>
<text x="171.96" y="318.74" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="18.67">通称江东门纪念馆，选址于南京大屠杀江东</tspan><tspan x="171.96" dy="24.27" fill="#FFFFFF" font-size="18.67">门集体屠杀遗址及遇难者丛葬地，是中国首</tspan><tspan x="171.96" dy="24.27" fill="#FFFFFF" font-size="18.67">批国家一级博物馆，首批全国爱国主义教育</tspan><tspan x="171.96" dy="24.27" fill="#FFFFFF" font-size="18.67">示范基地，全国重点文物保护单位</tspan></text>
</g>
<g id="shape-30" data-name="矩形 29">
<rect x="162.36" y="489.94" width="377.07" height="154.68" fill="none"/>
<text x="171.96" y="510.61" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="18.67">首批国家级抗战纪念设施、遗址名录，也是</tspan><tspan x="171.96" dy="24.27" fill="#FFFFFF" font-size="18.67">国际公认的二战期间三大惨案纪念馆之一。</tspan><tspan x="171.96" dy="24.27" fill="#FFFFFF" font-size="18.67"> 江东门纪念馆是为铭记侵华日军攻占中国</tspan><tspan x="171.96" dy="24.27" fill="#FFFFFF" font-size="18.67">首都南京后制造了惨无人道的南京大屠杀的</tspan><tspan x="171.96" dy="24.27" fill="#FFFFFF" font-size="18.67">暴行而筹建</tspan></text>
</g>
