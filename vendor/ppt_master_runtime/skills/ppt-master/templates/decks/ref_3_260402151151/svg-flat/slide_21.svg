<g id="shape-11-text" data-name="文本框 10 text">
<text x="944.62" y="148.39" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="18.67">美</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">国</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">作</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">家</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">赛</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">珍</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">珠</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">获</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">得</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">诺</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">贝</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">尔</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">文</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">学</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">奖</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">的</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">代</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">表</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">作</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">《</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">大</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">地</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">》</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">在</tspan><tspan x="944.62" dy="19.6" fill="#FFFFFF" font-size="18.67">南</tspan></text>
