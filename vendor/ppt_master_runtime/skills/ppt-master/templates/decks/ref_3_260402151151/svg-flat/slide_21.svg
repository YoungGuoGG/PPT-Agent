<g id="shape-12" data-name="文本框 11">
<rect x="68.62" y="464.03" width="709.9" height="184.08" fill="none"/>
<text x="78.22" y="484.7" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">南京是世界文学之都，中国历史上第一个“文学馆”、中国第一部诗歌理论和批评专</tspan><tspan x="78.22" dy="24.27" fill="#262626" font-size="18.67">著《诗品》、第一部文学理论和批评专著《文心雕龙》、第一部儿童启蒙读物《千字</tspan><tspan x="78.22" dy="24.27" fill="#262626" font-size="18.67">文》、现存最早的诗文总集《昭明文选》等均诞生在南京，中国文学史上有一万多部</tspan><tspan x="78.22" dy="24.27" fill="#262626" font-size="18.67">文学作品与南京密切相关。《红楼梦》《本草纲目》《永乐大典》《儒林外史》等巨</tspan><tspan x="78.22" dy="24.27" fill="#262626" font-size="18.67">作与南京密不可分近现代以来，鲁迅、巴金、朱自清、俞平伯、张恨水、张爱玲等文</tspan><tspan x="78.22" dy="24.27" fill="#262626" font-size="18.67">坛巨匠也都与南京有着千丝万缕的联系，</tspan></text>
</g></svg>