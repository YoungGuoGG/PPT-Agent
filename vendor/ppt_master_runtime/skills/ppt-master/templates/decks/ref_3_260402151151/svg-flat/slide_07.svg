<text x="787.86" y="477.66" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#262626"><tspan fill="#262626" font-size="21.33">自古有“南朝第一寺”，“南朝四百</tspan><tspan x="787.86" dy="25.6" fill="#262626" font-size="21.33">八十寺”之首的美誉，南朝时期与栖</tspan><tspan x="787.86" dy="25.6" fill="#262626" font-size="21.33">霞寺、定山寺齐名，是南朝时期中</tspan><tspan x="787.86" dy="25.6" fill="#262626" font-size="21.33">国的佛教中心。开放时间：7:30-</tspan><tspan x="787.86" dy="25.6" fill="#262626" font-size="21.33">17:00 ，门票价格：10元（免费赠</tspan><tspan x="787.86" dy="25.6" fill="#262626" font-size="21.33">送三根香）</tspan></text>
