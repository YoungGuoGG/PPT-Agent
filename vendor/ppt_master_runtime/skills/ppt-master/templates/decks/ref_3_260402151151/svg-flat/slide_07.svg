<rect x="240.19" y="454.73" width="351.05" height="194.12" fill="none"/>
<text x="249.79" y="477.66" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#262626"><tspan fill="#262626" font-size="21.33">鸡鸣寺位于南京市玄武区鸡笼山东</tspan><tspan x="249.79" dy="25.6" fill="#262626" font-size="21.33">麓山阜上，又称古鸡鸣寺，始建于</tspan><tspan x="249.79" dy="25.6" fill="#262626" font-size="21.33">西晋永康元年（300年），已有一</tspan><tspan x="249.79" dy="25.6" fill="#262626" font-size="21.33">千七百多年的历史，是南京最古老</tspan><tspan x="249.79" dy="25.6" fill="#262626" font-size="21.33">的梵刹和皇家寺庙之一，香火一直</tspan><tspan x="249.79" dy="25.6" fill="#262626" font-size="21.33">旺盛不衰</tspan></text>
</g>
