<g id="shape-11-text" data-name="文本框 10 text">
<text x="168.25" y="194.51" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#262626"><tspan fill="#262626" font-size="21.33">阅</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">江</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">楼</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">，</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">位</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">于</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">江</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">苏</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">省</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">南</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">京</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">市</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">鼓</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">楼</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">区</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">狮</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">子</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">山</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">巅</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">、</tspan><tspan x="168.25" dy="22.4" fill="#262626" font-size="21.33">扬</tspan></text>
</g>
