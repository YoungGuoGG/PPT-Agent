<g id="shape-13" data-name="文本框 12">
<rect x="656.62" y="269.78" width="470.67" height="276.2" fill="none"/>
<text x="666.22" y="292.71" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="21.33">有“江南第一楼”之称 。阅江楼隐喻阅江揽胜之</tspan><tspan x="666.22" dy="27.73" fill="#FFFFFF" font-size="21.33">意，主楼通高52米，外观4层暗有3层，共7层，</tspan><tspan x="666.22" dy="27.73" fill="#FFFFFF" font-size="21.33">碧瓦朱楹、彤扉彩盈，具有鲜明的古典皇家气派</tspan><tspan x="666.22" dy="27.73" fill="#FFFFFF" font-size="21.33">，为典型的明代皇家建筑风格，总建筑面积约</tspan><tspan x="666.22" dy="27.73" fill="#FFFFFF" font-size="21.33">5000平方米，与湖北武汉黄鹤楼、江西南昌滕</tspan><tspan x="666.22" dy="27.73" fill="#FFFFFF" font-size="21.33">王阁、湖南岳阳岳阳楼，并称江南四大名楼，</tspan><tspan x="666.22" dy="27.73" fill="#FFFFFF" font-size="21.33">2003年，阅江楼被全国景区质量评定委员会公</tspan><tspan x="666.22" dy="27.73" fill="#FFFFFF" font-size="21.33">布为国家AAAA级旅游景区 </tspan></text>
</g></svg>