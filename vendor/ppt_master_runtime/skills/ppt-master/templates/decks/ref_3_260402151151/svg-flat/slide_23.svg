<g id="shape-12" data-name="文本框 11">
<rect x="701.13" y="311.74" width="484.39" height="376.08" fill="none"/>
<text x="710.73" y="334.68" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#262626"><tspan fill="#262626" font-size="21.33">金陵琴派是中国古琴艺术的重要流派，对后世诸</tspan><tspan x="710.73" dy="27.73" fill="#262626" font-size="21.33">多琴派产生较大影响，源自于明代皇家乐官，演</tspan><tspan x="710.73" dy="27.73" fill="#262626" font-size="21.33">奏技法上具端庄肃穆，儒雅超然之风又不失严谨</tspan><tspan x="710.73" dy="27.73" fill="#262626" font-size="21.33">规范的特点，尽显皇家风范，是国家非物质文化</tspan><tspan x="710.73" dy="27.73" fill="#262626" font-size="21.33">遗产 。《茉莉花》是南京的民歌，源自于南京六</tspan><tspan x="710.73" dy="27.73" fill="#262626" font-size="21.33">合民间传唱百年的《鲜花调》，在国内外具有极</tspan><tspan x="710.73" dy="27.73" fill="#262626" font-size="21.33">高的知名度，在世界广为传颂，是中国文化的代</tspan><tspan x="710.73" dy="27.73" fill="#262626" font-size="21.33">表元素之一，因其特殊的地位，被誉为“中国的第</tspan><tspan x="710.73" dy="27.73" fill="#262626" font-size="21.33">二国歌”。此外还有高淳民歌《采红菱》《五月栽</tspan><tspan x="710.73" dy="27.73" fill="#262626" font-size="21.33">秧》，六合民歌《鲜花调》《留左吹打乐》等</tspan></text>
</g>
