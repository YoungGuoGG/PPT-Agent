<text x="209.61" y="246.4" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="24" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="24">曲</tspan><tspan x="209.61" dy="25.2" fill="#FFFFFF" font-size="24">艺</tspan><tspan x="209.61" dy="25.2" fill="#FFFFFF" font-size="24">：</tspan><tspan x="209.61" dy="25.2" fill="#FFFFFF" font-size="24">南</tspan><tspan x="209.61" dy="25.2" fill="#FFFFFF" font-size="24">京</tspan><tspan x="209.61" dy="25.2" fill="#FFFFFF" font-size="24">的</tspan><tspan x="209.61" dy="25.2" fill="#FFFFFF" font-size="24">地</tspan><tspan x="209.61" dy="25.2" fill="#FFFFFF" font-size="24">方</tspan><tspan x="209.61" dy="25.2" fill="#FFFFFF" font-size="24">曲</tspan><tspan x="209.61" dy="25.2" fill="#FFFFFF" font-size="24">艺</tspan><tspan x="209.61" dy="25.2" fill="#FFFFFF" font-size="24">有</tspan><tspan x="209.61" dy="25.2" fill="#FFFFFF" font-size="24">南</tspan><tspan x="209.61" dy="25.2" fill="#FFFFFF" font-size="24">京</tspan><tspan x="209.61" dy="25.2" fill="#FFFFFF" font-size="24">白</tspan></text>
</g></svg>