<g id="shape-8" data-name="矩形 7">
<rect x="85.33" y="575.08" width="1109.33" height="95.64" fill="none"/>
<text x="640" y="595.75" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626" letter-spacing="26.67"><tspan fill="#262626" font-size="18.67" letter-spacing="26.67">江南佳丽地、京邑、白门、皇都、吴京、帝里、江南第一州、江城、南国、行都、南中、南部、新都、新京、秦淮、钟山等40个以上</tspan><tspan x="640" dy="24.27" fill="#262626" font-size="18.67" letter-spacing="26.67">，建制的更变、名称的繁多，折射出南京历史发展的兴衰起伏。元至正二十八年，朱元璋在应天府称帝，国号大明，于应天府置南京</tspan><tspan x="640" dy="24.27" fill="#262626" font-size="18.67" letter-spacing="26.67">，此为“南京”地名之始</tspan></text>
</g>
