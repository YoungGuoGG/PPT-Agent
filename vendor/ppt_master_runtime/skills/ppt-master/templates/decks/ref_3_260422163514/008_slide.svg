<text x="908.1" y="207.68" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="24" fill="#FFFFFF" letter-spacing="4"><tspan fill="#FFFFFF" font-size="24" letter-spacing="4">漫步南浔老街，脚</tspan><tspan x="908.1" dy="36" fill="#FFFFFF" font-size="24" letter-spacing="4">边不远便河水。既</tspan><tspan x="908.1" dy="36" fill="#FFFFFF" font-size="24" letter-spacing="4">是水乡，便一定有</tspan><tspan x="908.1" dy="36" fill="#FFFFFF" font-size="24" letter-spacing="4">风了。丝丝细风掠</tspan><tspan x="908.1" dy="36" fill="#FFFFFF" font-size="24" letter-spacing="4">过水面，便让河水</tspan><tspan x="908.1" dy="36" fill="#FFFFFF" font-size="24" letter-spacing="4">泛起鱼尾纹，甚是</tspan><tspan x="908.1" dy="36" fill="#FFFFFF" font-size="24" letter-spacing="4">有趣。</tspan></text>
