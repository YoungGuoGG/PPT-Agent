<text x="76.73" y="261.47" text-anchor="start" xml:space="preserve" font-family="&quot;Source Han Sans CN Regular&quot;, &quot;汉仪粗简黑简&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">XX</tspan><tspan fill="#000000" font-size="21.33">自古就是交通要塞、商埠云聚之地，尤其是新中国成</tspan><tspan x="76.73" dy="27.73" fill="#000000" font-size="21.33">立后，随着XXXX水库和亚洲第一人工土坝的建成，使洈</tspan><tspan x="76.73" dy="27.73" fill="#000000" font-size="21.33">河 “野马”成了“良驹”，使得经济发展态势良好，农业产</tspan><tspan x="76.73" dy="27.73" fill="#000000" font-size="21.33">业</tspan><tspan fill="#000000" font-size="21.33">夯实了</tspan><tspan fill="#000000" font-size="21.33">基础。XXXX镇</tspan><tspan fill="#000000" font-size="21.33">是XXXX市面积第一、人口第一的</tspan><tspan x="76.73" dy="27.73" fill="#000000" font-size="21.33">大镇，是荆州市拥有省级度假区和国家森林公园的唯一镇</tspan><tspan x="76.73" dy="27.73" fill="#000000" font-size="21.33">。优越的人文地理条件为发展肉牛养殖及旅游第三产业提</tspan><tspan x="76.73" dy="27.73" fill="#000000" font-size="21.33">供了</tspan><tspan fill="#000000" font-size="21.33">“</tspan><tspan fill="#000000" font-size="21.33">天时地利人和</tspan><tspan fill="#000000" font-size="21.33">”</tspan><tspan fill="#000000" font-size="21.33">，是打造国家级标准化生态养牛场</tspan><tspan x="76.73" dy="27.73" fill="#000000" font-size="21.33">的绝佳基地选址</tspan><tspan fill="#000000" font-size="21.33">。</tspan></text>
</g>
