<g id="shape-2" data-name="文本框 1">
<rect x="44.13" y="105.53" width="1191.73" height="145.87" fill="none"/>
<text x="53.73" y="125.07" text-anchor="start" xml:space="preserve" font-family="&quot;Source Han Sans CN Regular&quot;, &quot;汉仪粗简黑简&quot;, sans-serif" font-size="17.33" fill="#404040"><tspan fill="#404040" font-size="17.33">由于国内需求规模庞大，中国的牛肉进口与相关肉制品的进口都有较大幅度的增长，20XX年我国进口牛肉约166万吨，进口金额为82.2亿美元。​</tspan></text>
<text x="53.73" y="147.6" text-anchor="start" xml:space="preserve" font-family="&quot;Source Han Sans CN Regular&quot;, &quot;汉仪粗简黑简&quot;, sans-serif" font-size="17.33" fill="#404040"><tspan fill="#404040" font-size="17.33">全球牛肉需求地区主要集中在中国、美国、日本、中国香港、韩国等地区，国内牛肉产量无法满足市场需求的上涨，加上牛养殖周期长，无法达到快速供</tspan><tspan x="53.73" dy="22.53" fill="#404040" font-size="17.33">给，只能依靠进口填补牛肉供需缺口，中国进口牛肉市场发展迅速，进口牛肉有效补足了中国牛肉市场的需求，进口依存度也出现上升的趋势。随着百姓</tspan><tspan x="53.73" dy="22.53" fill="#404040" font-size="17.33">肉品消费结构的升级，牛肉的消费量还将进一步增加，扩大牛肉进口平抑国内价格是必要手段之一。同时，加快我国草食畜牧业发展，大力发展肉牛规模</tspan><tspan x="53.73" dy="22.53" fill="#404040" font-size="17.33">养殖，也将成为未来畜牧业发展方向。</tspan></text>
</g>
