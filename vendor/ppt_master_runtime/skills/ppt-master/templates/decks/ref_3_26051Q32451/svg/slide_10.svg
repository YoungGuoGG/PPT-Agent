<g id="shape-110" data-name="X">
<rect x="102" y="561.07" width="1067.53" height="64.6" fill="none" stroke="none"/>
<text x="111.6" y="580.6" text-anchor="start" xml:space="preserve" font-family="&quot;Source Han Sans CN Regular&quot;, &quot;汉仪粗简黑简&quot;, sans-serif" font-size="17.33" fill="#000000"><tspan fill="#000000" font-size="17.33">与西方发达国家相比，我国肉牛养殖模式、技术推广体系还不够健全，行业整体缺乏先进科学的畜牧养殖技术和专业技术人才引进，我国</tspan><tspan x="111.6" dy="22.53" fill="#000000" font-size="17.33">畜牧养殖技术人员专业水平还很低，人力资源缺乏，人员素质低，对养殖户的技术指导不到位，从而阻碍了畜牧产业的发展。</tspan></text>
</g>
