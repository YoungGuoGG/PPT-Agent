<rect x="102" y="190.8" width="1067.53" height="63.4" fill="none" stroke="none"/>
<text x="111.6" y="210.33" text-anchor="start" xml:space="preserve" font-family="&quot;Source Han Sans CN Regular&quot;, &quot;汉仪粗简黑简&quot;, sans-serif" font-size="17.33" fill="#000000"><tspan fill="#000000" font-size="17.33">牛肉产品的百家争鸣、良莠不齐，消费者的资讯紊乱，市场认知和标准执行还亟待建立。另外牛肉肉质标准化不统一，包装、切割的不标</tspan><tspan x="111.6" dy="22.53" fill="#000000" font-size="17.33">准化，严重影响商家及顾客的采购，造成食材浪费。</tspan></text>
</g>
