<g id="shape-4" data-name="文本框 3">
<rect x="124.66" y="49.22" width="640.57" height="38.78" fill="none"/>
<text x="134.26" y="74.42" text-anchor="start" xml:space="preserve" font-family="sans-serif" font-size="24" fill="#000000"><tspan fill="#000000" font-size="24">民法典如何保护我们</tspan></text>
</g>
<g id="shape-7" data-name="文本框 6">
<rect x="68.77" y="260.49" width="1119.8" height="346.26" fill="none"/>
<text x="78.37" y="285.69" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;等线&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">《民法典》第一千一百九十九条无民事行为能力人在幼儿园，学校或者其他教育机构学习，生活期间受</tspan><tspan x="78.37" dy="31.2" fill="#404040" font-size="24">到人身揭害的，幼儿园，学校或者其他教育机构应当承担得权责任:但是，能够证明尽到教育，管理肥责</tspan><tspan x="78.37" dy="31.2" fill="#404040" font-size="24">的，不承相侵权责任。《民法典》第一千二百条限制民事行为能力人在学校或者其他教育机构学习、生</tspan><tspan x="78.37" dy="31.2" fill="#404040" font-size="24">活期间受到人身损害，学校或者其他教育机构未尽到教育、管理职责的，应当承担侵权责任。</tspan></text>
<text x="78.37" y="410.49" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;等线&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">《民法典》第一千二百零一条无民事行为能力人或者限制民事行为能力人在幼儿园，学校或者其他教育</tspan><tspan x="78.37" dy="31.2" fill="#404040" font-size="24">机构学习、生活期间，受到幼儿园、学校或者其他教育机构以外的第三人人身损害的，由第三人承担侵</tspan><tspan x="78.37" dy="31.2" fill="#404040" font-size="24">权责任;幼儿园、学校或者其他教育机构未尽到管理职责的，承担相应的补充责任。幼儿园、学校或者其</tspan><tspan x="78.37" dy="31.2" fill="#404040" font-size="24">他教育机构承担补充责任后，可以向第三人追偿。</tspan></text>
</g>
<g id="shape-10" data-name="组合 9">
<g id="shape-6" data-name="文本框 5">
<rect x="116.2" y="183.77" width="710.66" height="48.47" fill="#C00000" stroke="#C00000"/>
<text x="471.53" y="215.77" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;等线&quot;, sans-serif" font-size="32" fill="#FFFFFF" font-weight="bold"><tspan fill="#FFFFFF" font-size="32" font-weight="bold">一、与安全保障义务有关的侵权问题</tspan></text>
</g>
