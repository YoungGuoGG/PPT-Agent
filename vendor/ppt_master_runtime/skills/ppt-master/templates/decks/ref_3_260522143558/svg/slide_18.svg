<g id="shape-6" data-name="文本框 5">
<rect x="679.19" y="193.99" width="439.45" height="48.47" fill="#C00000" stroke="#C00000"/>
<text x="688.79" y="225.99" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;等线&quot;, sans-serif" font-size="32" fill="#FFFFFF" font-weight="bold"><tspan fill="#FFFFFF" font-size="32" font-weight="bold">不明抛掷物、坠落物致害责任</tspan></text>
</g>
<g id="shape-7" data-name="文本框 6">
<rect x="668.11" y="263.87" width="461.6" height="308.46" fill="none"/>
<text x="677.71" y="289.07" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;等线&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">《民法典》第一千二百五十四条禁止从建</tspan><tspan x="677.71" dy="31.2" fill="#404040" font-size="24">筑物中抛掷物品。从建筑物中抛掷物品或</tspan><tspan x="677.71" dy="31.2" fill="#404040" font-size="24">者从建筑物上坠落的物品造成他人损害的</tspan><tspan x="677.71" dy="31.2" fill="#404040" font-size="24">，由侵权人依法承担侵权责任;经调查难</tspan><tspan x="677.71" dy="31.2" fill="#404040" font-size="24">以确定具体侵权人的，除能够证明自己不</tspan><tspan x="677.71" dy="31.2" fill="#404040" font-size="24">是侵权人的外，由可能加害的建筑物使用</tspan><tspan x="677.71" dy="31.2" fill="#404040" font-size="24">人给予补偿。可能加害的建筑物使用人补</tspan><tspan x="677.71" dy="31.2" fill="#404040" font-size="24">偿后，有权向侵权人追偿。</tspan></text>
</g>
