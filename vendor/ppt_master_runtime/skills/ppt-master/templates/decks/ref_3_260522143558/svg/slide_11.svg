<g id="shape-8" data-name="文本框 7">
<rect x="82.92" y="267.54" width="1098.79" height="353.53" fill="none"/>
<text x="92.52" y="292.74" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;等线&quot;, sans-serif" font-size="24" fill="#262626"><tspan fill="#262626" font-size="24">《民法典》第一千零六十七条父母不属行抚养义务的，未成年子女或者不能独立生活的成年子女，有</tspan><tspan x="92.52" dy="36" fill="#262626" font-size="24">要求父母给付抚养费的权利。《民法典》第一千零八十四条 父母与子女间的关系，不因父母离婚而消</tspan><tspan x="92.52" dy="36" fill="#262626" font-size="24">除。离婚后，子女无论由父或母直接抚养，仍是父母双方的子女。</tspan></text>

<text x="92.52" y="436.74" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;等线&quot;, sans-serif" font-size="24" fill="#262626"><tspan fill="#262626" font-size="24">离婚后，父母对于子女仍有抚养、教育、保护的权利和义务。离婚后，不满两周岁的子女，以由母亲</tspan><tspan x="92.52" dy="36" fill="#262626" font-size="24">直接抚养为原则。已满两周岁的子女，父母双方对抚养问题协议不成的，由人民法院根据双方的具体</tspan><tspan x="92.52" dy="36" fill="#262626" font-size="24">情况，按照最有利于未成年子女的原则判决。子女已满八周岁的，应当尊重其真实意愿。</tspan></text>

