<g id="shape-7" data-name="文本框 6">
<rect x="81.8" y="194.4" width="677.71" height="55.19" fill="none"/>
<text x="91.4" y="226.4" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;等线&quot;, sans-serif" font-size="32" fill="#C00000" font-weight="bold"><tspan fill="#C00000" font-size="32" font-weight="bold">小学生直播打赏有效吗?</tspan></text>
</g>
<g id="shape-10" data-name="文本框 9">
<rect x="87.51" y="274.02" width="677.71" height="308.46" fill="none"/>
<text x="97.11" y="299.22" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;等线&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">• </tspan><tspan fill="#404040" font-size="24">民法典第二十条规定，不满八周岁的未成年人为无民事行为</tspan><tspan x="97.11" dy="31.2" fill="#404040" font-size="24">能力人，由其法定代理人代理实施民事法律行为。因此八周岁</tspan><tspan x="97.11" dy="31.2" fill="#404040" font-size="24">以下“打赏”、“送礼物”的行为无论金额大小，都是无效的，监</tspan><tspan x="97.11" dy="31.2" fill="#404040" font-size="24">护人可以要求主播返还。</tspan></text>
<text x="97.11" y="424.02" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;等线&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">• </tspan><tspan fill="#404040" font-size="24">八周岁以上的未成年人为限制民事行为能力人，实施民事法</tspan><tspan x="97.11" dy="31.2" fill="#404040" font-size="24">律行为由其法定代理人代理或者经其法定代理人同意、追认</tspan><tspan x="97.11" dy="31.2" fill="#404040" font-size="24">;但是，可以独立实施纯获利益的民事法律行为或者与其年龄</tspan><tspan x="97.11" dy="31.2" fill="#404040" font-size="24">、智力相适应的民事法律行为。</tspan></text>
</g>
</g>
