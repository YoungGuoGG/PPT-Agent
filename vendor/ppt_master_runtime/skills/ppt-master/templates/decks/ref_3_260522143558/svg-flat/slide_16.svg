<text x="91.4" y="418.84" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;等线&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">• </tspan><tspan fill="#404040" font-size="24">(二)因由法定扶养人以外的人扶养而选取扶养人姓氏;</tspan></text>
<text x="91.4" y="466.84" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;等线&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">• </tspan><tspan fill="#404040" font-size="24">(三)有不违背公序良俗的其他正当理由。</tspan></text>
<text x="91.4" y="514.84" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;等线&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">• </tspan><tspan fill="#404040" font-size="24">少数民族自然人的姓氏可以遵从本民族的文化传统和风俗习惯</tspan><tspan x="91.4" dy="48" fill="#404040" font-size="24">。</tspan></text>
