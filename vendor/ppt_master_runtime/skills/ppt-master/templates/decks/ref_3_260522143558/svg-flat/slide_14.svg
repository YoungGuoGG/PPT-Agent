<g id="shape-7" data-name="文本框 6">
<rect x="68.77" y="260.49" width="758.09" height="270.65" fill="none"/>
<text x="78.37" y="285.69" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;等线&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">• </tspan><tspan fill="#404040" font-size="24">《民法典》第一千零一十条违背他人意愿，以言语，文字，图像肢</tspan><tspan x="78.37" dy="31.2" fill="#404040" font-size="24">体行为等方式对他人实施性骚扰的，受害人有权依法请求行为人承担</tspan><tspan x="78.37" dy="31.2" fill="#404040" font-size="24">民事责任。机关，企业，学校等单位应当采取合理的预防，受理投诉</tspan></text>
<text x="78.37" y="379.29" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;等线&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">• </tspan><tspan fill="#404040" font-size="24">调查处置等措施，防止和制止利用职权，从属关系等实施性骚扰。</tspan><tspan x="78.37" dy="31.2" fill="#404040" font-size="24">《民法典》第一百九十一条 未成年人遭受性侵害的损害赔偿请求权的</tspan><tspan x="78.37" dy="31.2" fill="#404040" font-size="24">诉讼时效期间，自受害人年满十八周岁之日起计算。</tspan></text>
</g>
