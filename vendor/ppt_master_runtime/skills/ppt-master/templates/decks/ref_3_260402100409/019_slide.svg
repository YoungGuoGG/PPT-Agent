<g id="shape-13" data-name="文本框 12">
<rect x="525.77" y="471.65" width="709.9" height="74.57" fill="none"/>
<text x="535.37" y="494.58" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#262626"><tspan fill="#262626" font-size="21.33">p </tspan><tspan fill="#262626" font-size="21.33">羊肉汤 ：在开封，羊汤馆一般会将羊肉、羊杂等事先炖熟切好，食客进</tspan><tspan x="535.37" dy="27.73" fill="#262626" font-size="21.33">门时就说好要羊肉的还是羊杂的，要多少钱的。</tspan></text>
</g>
<g id="shape-14" data-name="文本框 13">
<rect x="525.77" y="567.65" width="709.9" height="108.17" fill="none"/>
<text x="535.37" y="590.58" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">p </tspan><tspan fill="#000000" font-size="21.33">四味菜 ：四味菜，也叫四味烩菜，其中“四味”指的是牛酥肉、烧丸子、</tspan><tspan x="535.37" dy="27.73" fill="#000000" font-size="21.33">煨面筋和黄花菜。经营四味菜的店家一般门口要支起五口锅，其中四口煨</tspan><tspan x="535.37" dy="27.73" fill="#000000" font-size="21.33">着“四味”，还有一口锅中是沸腾的羊汤。</tspan></text>
