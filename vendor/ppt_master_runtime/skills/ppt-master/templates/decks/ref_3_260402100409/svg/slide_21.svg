<g id="shape-17" data-name="文本框 16">
<rect x="604.2" y="267.38" width="539.8" height="95.87" fill="none"/>
<text x="613.8" y="288.05" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">灌汤小笼包是具有开封传统的风味小吃，已有百年历史。其外</tspan><tspan x="613.8" dy="24.27" fill="#262626" font-size="18.67">观精美，放下似菊花，夹起来像灯笼。皮薄馅多，灌汤流油，</tspan><tspan x="613.8" dy="24.27" fill="#262626" font-size="18.67">鲜香可口，现蒸现吃。</tspan></text>
</g>
<g id="shape-18" data-name="文本框 17">
<rect x="604.13" y="533.45" width="539.95" height="95.87" fill="none"/>
<text x="613.73" y="554.11" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">套四宝，堪称“豫菜一绝”。鸡、鸭、鸽、鹌鹑四只全禽层层相</tspan><tspan x="613.73" dy="24.27" fill="#262626" font-size="18.67">套，个个通体完整，无一根骨头。一道菜肴多种味道，不肥不</tspan><tspan x="613.73" dy="24.27" fill="#262626" font-size="18.67">腻，清爽可口，回味绵长。</tspan></text>
</g>
