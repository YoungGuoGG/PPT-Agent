<g id="shape-24" data-name="文本框 23">
<rect x="178.72" y="269.94" width="554.23" height="154.68" fill="none"/>
<text x="188.32" y="290.61" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="18.67">朱仙镇木版年画是中国古老的传统工艺品之一。作为中国木版年</tspan><tspan x="188.32" dy="24.27" fill="#FFFFFF" font-size="18.67">画的鼻祖，主要分布于河南省开封市祥符区朱仙镇及其周边地区</tspan><tspan x="188.32" dy="24.27" fill="#FFFFFF" font-size="18.67">。朱仙镇木版年画具有构图饱满，线条粗犷简炼，造型古朴夸张</tspan><tspan x="188.32" dy="24.27" fill="#FFFFFF" font-size="18.67">，色彩新鲜艳丽等特点。2006年5月20日，朱仙镇木版年画经国</tspan><tspan x="188.32" dy="24.27" fill="#FFFFFF" font-size="18.67">务院批准列入第一批国家级非物质文化遗产名录。</tspan></text>
</g>
</g>
