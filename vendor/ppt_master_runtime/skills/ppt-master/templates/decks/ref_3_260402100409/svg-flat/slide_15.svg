<g id="shape-12" data-name="文本框 11">
<rect x="103.82" y="476.72" width="1037.51" height="141.78" fill="none"/>
<text x="113.42" y="499.66" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#262626"><tspan fill="#262626" font-size="21.33">开封铁塔因坐落在开宝寺内而又叫开宝寺塔。铁塔高55.88米，八角十三层，因此地曾为开宝寺，又称“开宝</tspan><tspan x="113.42" dy="27.73" fill="#262626" font-size="21.33">寺塔”，又因遍体通彻褐色琉璃砖，混似铁铸，从元代起民间称其为“铁塔”。</tspan><tspan fill="#000000" font-size="21.33">大相国寺：原名为建国寺，位于</tspan><tspan x="113.42" dy="27.73" fill="#000000" font-size="21.33">河南开封，从公元555年建寺至今，已有1450年的历史。一千多年来，大相国寺蕴含着厚重的文化和许多充满</tspan><tspan x="113.42" dy="27.73" fill="#000000" font-size="21.33">传奇色彩的故事，即有过皇家寺院的辉煌，也有过文化寺院的风采，还有过市井寺院的繁荣。</tspan></text>
</g>
