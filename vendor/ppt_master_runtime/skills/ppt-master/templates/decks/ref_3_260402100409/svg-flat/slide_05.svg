</g>
<g id="shape-18" data-name="iŝļîḍê">
<rect x="723.86" y="562.44" width="508.9" height="75.39" fill="none" stroke="none"/>
<text x="733.31" y="583.22" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">宋朝都城东京城是当时世界第一大城市，是清明上河图的创</tspan><tspan x="733.31" dy="24.27" fill="#262626" font-size="18.67">作地。2022年，开封市地区生产总值2657.11亿元，比上年</tspan><tspan x="733.31" dy="24.27" fill="#262626" font-size="18.67">增长4.3% </tspan></text>
</g>
