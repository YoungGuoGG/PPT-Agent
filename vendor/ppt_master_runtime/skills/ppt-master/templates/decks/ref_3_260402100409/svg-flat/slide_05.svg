<g id="shape-12" data-name="iŝ1íḓé">
<rect x="723.86" y="201.91" width="508.9" height="75.39" fill="none" stroke="none"/>
<text x="733.31" y="222.69" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">中国开封清明文化节、中国开封菊花文化节吸引着众多海内</tspan><tspan x="733.31" dy="24.27" fill="#262626" font-size="18.67">外游客 。开封市是首批国家历史文化名城，迄今已有4100余</tspan><tspan x="733.31" dy="24.27" fill="#262626" font-size="18.67">年的建城史和建都史，先后有夏朝，战国时期的魏国</tspan></text>
</g>
<g id="shape-13" data-name="íŝḻiďe">
<ellipse cx="697.07" cy="241.13" rx="20.1" ry="20.1" fill="#B3531D" stroke-width="4" stroke="none"/>
