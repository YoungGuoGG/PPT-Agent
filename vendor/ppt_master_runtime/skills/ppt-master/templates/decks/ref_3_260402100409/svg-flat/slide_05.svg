</g>
<g id="shape-14" data-name="í$1îḓê">
<rect x="723.86" y="322.09" width="508.9" height="75.39" fill="none" stroke="none"/>
<text x="733.31" y="342.87" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">五代时期的后梁、后晋、后汉、后周，宋朝，金朝等在此定</tspan><tspan x="733.31" dy="24.27" fill="#262626" font-size="18.67">都，素有“八朝古都”之称 ，孕育了上承汉唐、下启明清、</tspan><tspan x="733.31" dy="24.27" fill="#262626" font-size="18.67">影响深远的“宋文化” 。自宋代以后</tspan></text>
</g>
