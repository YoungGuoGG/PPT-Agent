</g>
<g id="shape-16" data-name="iśľiḋê">
<rect x="723.86" y="442.27" width="508.9" height="75.39" fill="none" stroke="none"/>
<text x="733.31" y="463.05" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">历代王朝都把开封作为中国北方的区域性政治、经济和文化</tspan><tspan x="733.31" dy="24.27" fill="#262626" font-size="18.67">中心 。开封是世界上唯一一座城市中轴线从未变动的都城</tspan><tspan x="733.31" dy="24.27" fill="#262626" font-size="18.67">，城摞城遗址在世界考古史和都城史上少有</tspan></text>
</g>
