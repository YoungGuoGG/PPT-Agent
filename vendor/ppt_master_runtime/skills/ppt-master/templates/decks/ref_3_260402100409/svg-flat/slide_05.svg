<text x="134.07" y="346.44" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">开封市地处中国华中地区、河南省东部、中原腹地</tspan><tspan x="134.07" dy="24.27" fill="#262626" font-size="18.67">、黄河之滨，西与郑州毗邻。开封自贸区是中国（</tspan><tspan x="134.07" dy="24.27" fill="#262626" font-size="18.67">河南）自由贸易试验区三大片区之一 。中国第一大</tspan><tspan x="134.07" dy="24.27" fill="#262626" font-size="18.67">地方剧种豫剧发源于此，开封拥有国家5A、4A级旅</tspan></text>
