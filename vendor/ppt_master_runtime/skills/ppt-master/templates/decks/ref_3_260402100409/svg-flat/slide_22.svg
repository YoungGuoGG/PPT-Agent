<g id="shape-14" data-name="文本框 13">
<rect x="542.82" y="329.13" width="633.56" height="95.87" fill="none"/>
<text x="552.42" y="349.8" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="18.67">p </tspan><tspan fill="#FFFFFF" font-size="18.67">桶子鸡 ：桶子鸡也是开封特产名菜，最为出名的当属“马豫兴”。桶子鸡</tspan><tspan x="552.42" dy="24.27" fill="#FFFFFF" font-size="18.67">体形浑圆完美，色泽鹅黄，油润光亮，食之肥而不腻，咸香嫩脆，略透荷</tspan><tspan x="552.42" dy="24.27" fill="#FFFFFF" font-size="18.67">香，成为开封酒会宴席上必备名菜。</tspan></text>
</g>
<g id="shape-15" data-name="文本框 14">
<rect x="542.82" y="434.68" width="633.56" height="66.46" fill="none"/>
<text x="552.42" y="455.34" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="18.67">p </tspan><tspan fill="#FFFFFF" font-size="18.67">开封拉面：开封拉面和兰州拉面最明显的不同就是开封拉面没汤，用河南</tspan><tspan x="552.42" dy="24.27" fill="#FFFFFF" font-size="18.67">名词解释就是兰州拉面是汤面条而开封拉面是捞面条。</tspan></text>
</g>
<g id="shape-16" data-name="文本框 15">
<rect x="542.82" y="257.34" width="633.56" height="66.46" fill="none"/>
<text x="552.42" y="278.01" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="18.67">p </tspan><tspan fill="#FFFFFF" font-size="18.67">鲤鱼焙面：鲤鱼焙面，由&quot;糖醋熘鱼&quot;和&quot;焙龙须面&quot;两道名菜配制而成。</tspan><tspan x="552.42" dy="24.27" fill="#FFFFFF" font-size="18.67">其特点是色泽枣红，软嫩鲜香；焙面细如发丝，蓬松酥脆。</tspan></text>
