<g id="shape-14" data-name="文本框 13">
<rect x="756.47" y="453.93" width="453" height="175.38" fill="none"/>
<text x="766.07" y="476.87" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">是我国四大名镇之一，地理位置险要，文化底</tspan><tspan x="766.07" dy="27.73" fill="#000000" font-size="21.33">蕴深厚。《祥符县志》记载：“朱仙镇相传战</tspan><tspan x="766.07" dy="27.73" fill="#000000" font-size="21.33">国时为朱亥故里，亥旧居仙人庄，故名。”春</tspan><tspan x="766.07" dy="27.73" fill="#000000" font-size="21.33">秋时朱仙镇位于当时的启封故城西北，朱仙镇</tspan><tspan x="766.07" dy="27.73" fill="#000000" font-size="21.33">相关历史事件多以启封地名记载。</tspan></text>
</g>
