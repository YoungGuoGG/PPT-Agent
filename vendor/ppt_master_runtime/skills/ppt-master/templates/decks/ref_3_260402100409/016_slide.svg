<g id="shape-11" data-name="文本框 10">
<rect x="824" y="232.58" width="388" height="309.8" fill="none"/>
<text x="833.6" y="255.51" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#262626"><tspan fill="#262626" font-size="21.33">龙亭公园：建于六朝  (五代时期后梁、</tspan><tspan x="833.6" dy="27.73" fill="#262626" font-size="21.33">后晋、后汉、后周、北宋、及金朝 ) 皇</tspan><tspan x="833.6" dy="27.73" fill="#262626" font-size="21.33">宫的遗址之上，按清代万寿宫布局而建</tspan><tspan x="833.6" dy="27.73" fill="#262626" font-size="21.33">的古建筑群体，自南向北由午门就是景</tspan><tspan x="833.6" dy="27.73" fill="#262626" font-size="21.33">区南大门、玉带桥、嵩呼、朝门、东西</tspan><tspan x="833.6" dy="27.73" fill="#262626" font-size="21.33">朝房、照壁、龙亭大殿、宋代蜡像馆、</tspan><tspan x="833.6" dy="27.73" fill="#262626" font-size="21.33">东西垂花门和东西跨院、北宋东京城和</tspan><tspan x="833.6" dy="27.73" fill="#262626" font-size="21.33">皇城模型、北宋皇城拱宸门遗址、《五</tspan><tspan x="833.6" dy="27.73" fill="#262626" font-size="21.33">岳真形碑》方亭、北门、东便门等组成</tspan><tspan x="833.6" dy="27.73" fill="#262626" font-size="21.33">。</tspan></text>
</g>
<g id="shape-13" data-name="文本框 12">
<rect x="54.93" y="586.51" width="1186.67" height="74.57" fill="none"/>
<text x="64.53" y="609.44" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#262626"><tspan fill="#262626" font-size="21.33">开封府：是北宋京都官吏行政、司法的衙署，被誉为天下首府， 历史上的开封府府衙早已经湮灭在历史的烟尘中，现所看到</tspan><tspan x="64.53" dy="27.73" fill="#262626" font-size="21.33">的开封府，是以宋代开封府衙为原型重新修建的主题文化景区。</tspan></text>
</g></svg>