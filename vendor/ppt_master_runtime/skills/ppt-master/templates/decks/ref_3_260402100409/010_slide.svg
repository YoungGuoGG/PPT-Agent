<g id="shape-12-text" data-name="文本框 11 text">
<text x="183.9" y="212.44" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">豫</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">剧</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">，</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">又</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">名</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">河</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">南</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">梆</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">子</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">、</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">河</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">南</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">高</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">调</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">，</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">其</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">中</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">祥</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">符</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">调</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">是</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">豫</tspan><tspan x="183.9" dy="19.6" fill="#262626" font-size="18.67">剧</tspan></text>
