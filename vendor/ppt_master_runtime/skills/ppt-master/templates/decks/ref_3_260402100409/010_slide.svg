<g id="shape-14" data-name="文本框 13">
<rect x="661.2" y="315.5" width="470.67" height="213.48" fill="none"/>
<text x="670.8" y="336.16" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#FFFFFF"><tspan fill="#FFFFFF" font-size="18.67">汴绣：北宋时期，都城东京开封城内刺绣工艺已发展到</tspan><tspan x="670.8" dy="24.27" fill="#FFFFFF" font-size="18.67">相当高的水平。开封云集各地及异国的巧匠绣工，官办</tspan><tspan x="670.8" dy="24.27" fill="#FFFFFF" font-size="18.67">的有文绣院，民间的有秀巷，汴绣即在此传统基础上发</tspan><tspan x="670.8" dy="24.27" fill="#FFFFFF" font-size="18.67">展起来。近些年开封的汴绣独树一帜，山水人物，楼台</tspan><tspan x="670.8" dy="24.27" fill="#FFFFFF" font-size="18.67">花鸟，针线细密，不露边缝，绒彩夺目，丰神宛然，色</tspan><tspan x="670.8" dy="24.27" fill="#FFFFFF" font-size="18.67">彩丰富，层次分明，立体感强，成为国内外游客必买的</tspan><tspan x="670.8" dy="24.27" fill="#FFFFFF" font-size="18.67">艺术佳品。</tspan></text>
</g></svg>