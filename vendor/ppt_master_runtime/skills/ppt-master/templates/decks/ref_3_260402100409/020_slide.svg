<text x="913.62" y="523.12" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">开封重口味的汤并不只有羊双</tspan><tspan x="913.62" dy="24.27" fill="#262626" font-size="18.67">肠汤一个，还有鸡血汤。做法</tspan><tspan x="913.62" dy="24.27" fill="#262626" font-size="18.67">一般是采用整鸡炖煮熬汤，将</tspan><tspan x="913.62" dy="24.27" fill="#262626" font-size="18.67">鸡血、鸡肠、鸡心、鸡肝、鸡</tspan><tspan x="913.62" dy="24.27" fill="#262626" font-size="18.67">肉酥肉等各种食材备好。</tspan></text>
