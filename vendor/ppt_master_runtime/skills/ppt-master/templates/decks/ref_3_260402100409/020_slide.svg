<text x="515.44" y="523.12" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">对于开封人而言，用胡辣汤开</tspan><tspan x="515.44" dy="24.27" fill="#262626" font-size="18.67">启元气满满的一天也是不错的</tspan><tspan x="515.44" dy="24.27" fill="#262626" font-size="18.67">选择，而且差不多10块钱就可</tspan><tspan x="515.44" dy="24.27" fill="#262626" font-size="18.67">以饱餐一顿了。</tspan></text>
