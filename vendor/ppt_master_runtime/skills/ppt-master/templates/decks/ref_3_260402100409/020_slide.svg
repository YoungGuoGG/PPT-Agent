<g id="shape-23" data-name="îş1ïḍê">
<rect x="107.81" y="502.34" width="268.72" height="160.32" fill="none"/>
<text x="117.26" y="523.12" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="18.67" fill="#262626"><tspan fill="#262626" font-size="18.67">羊肉汤也好，烩菜也好，在河</tspan><tspan x="117.26" dy="24.27" fill="#262626" font-size="18.67">南的很多城市，都有它们的踪</tspan><tspan x="117.26" dy="24.27" fill="#262626" font-size="18.67">影。不过，有一碗汤绝对是只</tspan><tspan x="117.26" dy="24.27" fill="#262626" font-size="18.67">属于开封人的，出了开封很难</tspan><tspan x="117.26" dy="24.27" fill="#262626" font-size="18.67">找得到，那就是羊双肠汤。</tspan></text>
