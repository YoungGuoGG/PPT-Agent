<g id="shape-32" data-name="TextBox 12">
<rect x="81.83" y="507.95" width="1127.5" height="136.05" fill="none"/>
<text x="91.43" y="533.15" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体 CN&quot;, sans-serif" font-size="24" fill="#262626"><tspan fill="#262626" font-size="24">Ø </tspan><tspan fill="#262626" font-size="24">《</tspan><tspan fill="#262626" font-size="24">民法典</tspan><tspan fill="#262626" font-size="24">》</tspan><tspan fill="#262626" font-size="24">第十七条</tspan><tspan fill="#262626" font-size="24">:</tspan><tspan fill="#262626" font-size="24">十八周岁以上的自然人为成年人。不满十八周岁的自然人为未成年人。</tspan></text>
<text x="91.43" y="569.15" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体 CN&quot;, sans-serif" font-size="24" fill="#262626"><tspan fill="#262626" font-size="24">Ø </tspan><tspan fill="#262626" font-size="24">第十八条</tspan><tspan fill="#262626" font-size="24">:</tspan><tspan fill="#262626" font-size="24">成年人为完全民事行为能力人，可以独立实施民事法律行为。</tspan></text>

