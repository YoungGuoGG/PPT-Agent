<g id="shape-31" data-name="矩形 30">
<rect x="143.83" y="555.63" width="1068.56" height="123.29" fill="none"/>
<text x="153.43" y="583.1" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体 CN&quot;, sans-serif" font-size="26.67" fill="#404040"><tspan fill="#404040" font-size="26.67">《</tspan><tspan fill="#404040" font-size="26.67">民法典</tspan><tspan fill="#404040" font-size="26.67">》</tspan><tspan fill="#404040" font-size="26.67">人格权编：自然人的个人信息受法律保护。任何组织或者个人需要获取他人个</tspan><tspan x="153.43" dy="32" fill="#404040" font-size="26.67">人信息的，应当依法取得并确保信息安全，不得非法收集、使用、加工、传输他人个人信</tspan><tspan x="153.43" dy="32" fill="#404040" font-size="26.67">息，不得非法买卖、提供或者公开他人个人信息。</tspan></text>
</g>
