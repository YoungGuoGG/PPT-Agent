<g id="shape-4" data-name="矩形 3">
<rect x="67.61" y="239.8" width="612.23" height="123.29" fill="none"/>
<text x="77.21" y="267.26" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体 CN&quot;, sans-serif" font-size="26.67" fill="#C00000" font-weight="bold"><tspan fill="#C00000" font-size="26.67" font-weight="bold">年岁渐长，此时的我们更加成熟，拥有自己的事业</tspan><tspan x="77.21" dy="32" fill="#C00000" font-size="26.67" font-weight="bold">，有了更多财产，结婚、生子、买房都是人生大事</tspan><tspan x="77.21" dy="32" fill="#C00000" font-size="26.67" font-weight="bold">，而</tspan><tspan fill="#C00000" font-size="26.67" font-weight="bold">《</tspan><tspan fill="#C00000" font-size="26.67" font-weight="bold">民法典</tspan><tspan fill="#C00000" font-size="26.67" font-weight="bold">》</tspan><tspan fill="#C00000" font-size="26.67" font-weight="bold">是如何保障我们安居乐业呢？</tspan></text>
