<g id="shape-31" data-name="矩形 30">
<rect x="134.7" y="483.28" width="612.23" height="200.84" fill="none"/>
<text x="144.3" y="510.75" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体 CN&quot;, sans-serif" font-size="26.67" fill="#404040"><tspan fill="#404040" font-size="26.67">违背他人意愿，以言语、文字、图像、肢体行为等</tspan><tspan x="144.3" dy="32" fill="#404040" font-size="26.67">方式对他人实施性骚扰的，受害人有权依法请求行</tspan><tspan x="144.3" dy="32" fill="#404040" font-size="26.67">为人承担民事责任。机关、企业、学校等单位应当</tspan><tspan x="144.3" dy="32" fill="#404040" font-size="26.67">采取合理的预防、受理投诉、调查处置等措施，防</tspan><tspan x="144.3" dy="32" fill="#404040" font-size="26.67">止和制止利用职权、从属关系等实施性骚扰。</tspan></text>
</g>
