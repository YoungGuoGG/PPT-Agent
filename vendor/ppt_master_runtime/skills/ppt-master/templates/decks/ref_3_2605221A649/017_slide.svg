<text x="656.88" y="496.56" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体 CN&quot;, sans-serif" font-size="26.67" fill="#404040"><tspan fill="#404040" font-size="26.67">旅客应当按照有效客票记载的时间、班次和座</tspan><tspan x="656.88" dy="32" fill="#404040" font-size="26.67">位号乘坐。旅客无票乘坐、超程乘坐、越级乘</tspan><tspan x="656.88" dy="32" fill="#404040" font-size="26.67">坐或者持不符合减价条件的优惠客票乘坐的，</tspan><tspan x="656.88" dy="32" fill="#404040" font-size="26.67">应当补交票款，承运人可以按照规定加收票款</tspan><tspan x="656.88" dy="32" fill="#404040" font-size="26.67">；旅客不支付票款的，承运人可以拒绝运输。</tspan></text>
</g>
