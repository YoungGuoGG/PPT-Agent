<text x="123.92" y="442.37" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体 CN&quot;, sans-serif" font-size="24" fill="#000000"><tspan fill="#000000" font-size="24">2020</tspan><tspan fill="#000000" font-size="24">年</tspan><tspan fill="#000000" font-size="24">5</tspan><tspan fill="#000000" font-size="24">月</tspan><tspan fill="#000000" font-size="24">28</tspan><tspan fill="#000000" font-size="24">日，十三届全国人大三次会议表</tspan><tspan x="123.92" dy="36" fill="#000000" font-size="24">决通过了</tspan><tspan fill="#000000" font-size="24">《</tspan><tspan fill="#000000" font-size="24">中华人民共和国民法典</tspan><tspan fill="#000000" font-size="24">》</tspan><tspan fill="#000000" font-size="24">，自</tspan><tspan fill="#000000" font-size="24">2021</tspan><tspan x="123.92" dy="36" fill="#000000" font-size="24">年</tspan><tspan fill="#000000" font-size="24">1</tspan><tspan fill="#000000" font-size="24">月</tspan><tspan fill="#000000" font-size="24">1</tspan><tspan fill="#000000" font-size="24">日起施行。</tspan></text>
