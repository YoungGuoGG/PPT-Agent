</g>
<g id="shape-21" data-name="文本框 20">
<rect x="729.87" y="459.2" width="427.33" height="186.8" fill="none"/>
<text x="739.47" y="482.13" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">洛阳市境内主要河流有黄河、洛河、伊河、</tspan><tspan x="739.47" dy="25.6" fill="#404040" font-size="21.33">涧河、汝河等。黄河为北部界河，过境长</tspan><tspan x="739.47" dy="25.6" fill="#404040" font-size="21.33">97千米；洛河过境长200千米；伊河发源于</tspan><tspan x="739.47" dy="25.6" fill="#404040" font-size="21.33">栾川县南境伏牛山区，在偃师汇入洛河，过</tspan><tspan x="739.47" dy="25.6" fill="#404040" font-size="21.33">境长175.3千米。境内河流主要属黄河流域</tspan><tspan x="739.47" dy="25.6" fill="#404040" font-size="21.33">，发源于伏牛山的老灌河、白河属长江水系</tspan><tspan x="739.47" dy="25.6" fill="#404040" font-size="21.33">。</tspan></text>
</g>
<g id="shape-22" data-name="文本框 21">
<rect x="739.8" y="427.53" width="162.13" height="38.67" fill="none"/>
