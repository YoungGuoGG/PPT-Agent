<g id="shape-19" data-name="文本框 18">
<rect x="187.6" y="147.27" width="434.47" height="211.8" fill="none"/>
<text x="197.2" y="170.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">洛阳市总面积1.52万平方千米，其中市区面</tspan><tspan x="197.2" dy="25.6" fill="#404040" font-size="21.33">积2274平方千米，河南省西部，地处东经</tspan><tspan x="197.2" dy="25.6" fill="#404040" font-size="21.33">112°16'-112°37'，北纬34°32'-34°45'，东</tspan><tspan x="197.2" dy="25.6" fill="#404040" font-size="21.33">西长约179千米，南北宽约168千米。横跨黄</tspan><tspan x="197.2" dy="25.6" fill="#404040" font-size="21.33">河中下游南北两岸，东邻郑州市，西接三门</tspan><tspan x="197.2" dy="25.6" fill="#404040" font-size="21.33">峡市，北跨黄河与焦作市接壤，南与平顶山</tspan><tspan x="197.2" dy="25.6" fill="#404040" font-size="21.33">市、南阳市相连。</tspan></text>
</g>
</g>
<g id="shape-13" data-name="组合 12">
<g id="shape-10" data-name="图片 9">
<image href="../assets/image17.png" x="679.6" y="125.27" width="529.27" height="270.47" preserveAspectRatio="none"/>
</g>
<g id="shape-11" data-name="文本框 10">
<rect x="729.87" y="192.6" width="427.33" height="160.2" fill="none"/>
<text x="739.47" y="215.53" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">洛阳市地势西高东低，境内山川丘陵交错，</tspan><tspan x="739.47" dy="25.6" fill="#404040" font-size="21.33">地形复杂，其中山区45.51%，丘陵</tspan><tspan x="739.47" dy="25.6" fill="#404040" font-size="21.33">40.73%，平原占13.8%，周围有郁山、邙山</tspan><tspan x="739.47" dy="25.6" fill="#404040" font-size="21.33">、青要山、荆紫山、周山、樱山、龙门山、</tspan><tspan x="739.47" dy="25.6" fill="#404040" font-size="21.33">香山、万安山、首阳山、嵩山等多座山脉。</tspan></text>
</g>
<g id="shape-12" data-name="文本框 11">
<rect x="739.8" y="156.73" width="162.13" height="38.67" fill="none"/>
<text x="749.4" y="181.93" text-anchor="start" xml:space="preserve" font-family="&quot;华文行楷&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="24" fill="#7E6338" font-weight="bold"><tspan fill="#7E6338" font-size="24" font-weight="bold">地形地貌</tspan></text>
</g>
</g>
<g id="shape-14" data-name="组合 13">
<g id="shape-15" data-name="图片 14">
<image href="../assets/image17.png" x="143.07" y="408.2" width="529.27" height="270.47" preserveAspectRatio="none"/>
</g>
<g id="shape-16" data-name="文本框 15">
<rect x="203.27" y="476.93" width="404.53" height="158.73" fill="none"/>
<text x="212.87" y="499.87" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">洛阳市属暖温带大陆性季风气候，年均气</tspan><tspan x="212.87" dy="25.6" fill="#404040" font-size="21.33">温12.2-24.6℃，无霜期210天以上，年降</tspan><tspan x="212.87" dy="25.6" fill="#404040" font-size="21.33">水量528-800毫米，年日照为2200-</tspan><tspan x="212.87" dy="25.6" fill="#404040" font-size="21.33">2300小时，年均湿度60-70%。主要自然</tspan><tspan x="212.87" dy="25.6" fill="#404040" font-size="21.33">灾害有旱、满、雹、暴雨、干热风等。</tspan></text>
</g>
<g id="shape-17" data-name="文本框 16">
<rect x="203.27" y="449.47" width="162.13" height="38.67" fill="none"/>
<text x="212.87" y="474.67" text-anchor="start" xml:space="preserve" font-family="&quot;华文行楷&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="24" fill="#7E6338" font-weight="bold"><tspan fill="#7E6338" font-size="24" font-weight="bold">气候</tspan></text>
</g>
</g>
<g id="shape-18" data-name="组合 17">
