<g id="shape-26" data-name="文本框 25">
<rect x="909.67" y="314.93" width="293.2" height="258.07" fill="none"/>
<text x="1056.27" y="337.87" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">关公信俗属于传统民间信俗</tspan><tspan x="1056.27" dy="25.6" fill="#404040" font-size="21.33">，是民间信仰关公的各种习</tspan><tspan x="1056.27" dy="25.6" fill="#404040" font-size="21.33">俗的统称，它是一种传统信</tspan><tspan x="1056.27" dy="25.6" fill="#404040" font-size="21.33">仰文化。河南洛阳的关林是</tspan><tspan x="1056.27" dy="25.6" fill="#404040" font-size="21.33">我国唯一冢、庙、林三祀合</tspan><tspan x="1056.27" dy="25.6" fill="#404040" font-size="21.33">一的古代建筑群，至今已有</tspan><tspan x="1056.27" dy="25.6" fill="#404040" font-size="21.33">千余年历史。</tspan></text>
</g>
