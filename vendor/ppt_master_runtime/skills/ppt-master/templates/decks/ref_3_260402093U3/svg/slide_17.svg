<g id="shape-20" data-name="文本框 19">
<rect x="628.33" y="314.93" width="293.2" height="258.07" fill="none"/>
<text x="774.93" y="337.87" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">洛阳水席，是河南洛阳一带</tspan><tspan x="774.93" dy="25.6" fill="#404040" font-size="21.33">特色传统名宴，属于豫菜系</tspan><tspan x="774.93" dy="25.6" fill="#404040" font-size="21.33">。洛阳水席始于唐代，已有</tspan><tspan x="774.93" dy="25.6" fill="#404040" font-size="21.33">1000多年的历史，是中国迄</tspan><tspan x="774.93" dy="25.6" fill="#404040" font-size="21.33">今保留下来的历史最久远的</tspan><tspan x="774.93" dy="25.6" fill="#404040" font-size="21.33">名宴之一。“洛阳水席”被评</tspan><tspan x="774.93" dy="25.6" fill="#404040" font-size="21.33">为“中国菜”河南十大主题名</tspan><tspan x="774.93" dy="25.6" fill="#404040" font-size="21.33">宴。</tspan></text>
</g>
<g id="shape-21" data-name="文本框 20">
