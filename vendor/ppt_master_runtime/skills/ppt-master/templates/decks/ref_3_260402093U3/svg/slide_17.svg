<g id="shape-27" data-name="文本框 26">
<rect x="55.2" y="314.93" width="303.6" height="313.4" fill="none"/>
<text x="207" y="337.87" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">河洛大鼓，俗称“说书”，河南</tspan><tspan x="207" dy="25.6" fill="#404040" font-size="21.33">传统地方曲种之一。</tspan></text>
<text x="207" y="389.07" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">河洛大鼓是一种以说、唱为艺</tspan><tspan x="207" dy="25.6" fill="#404040" font-size="21.33">术表演手段，叙述故事、塑造</tspan><tspan x="207" dy="25.6" fill="#404040" font-size="21.33">人物、表达思想感情、歌唱社</tspan><tspan x="207" dy="25.6" fill="#404040" font-size="21.33">会生活的传统音乐。其演唱艺</tspan><tspan x="207" dy="25.6" fill="#404040" font-size="21.33">术形式有十一种词牌，最具代</tspan><tspan x="207" dy="25.6" fill="#404040" font-size="21.33">表性的传统曲目有《刘公案》</tspan><tspan x="207" dy="25.6" fill="#404040" font-size="21.33">、《双打擂》、《大红袍》、</tspan><tspan x="207" dy="25.6" fill="#404040" font-size="21.33">《大八义》、《小八义》等。</tspan></text>
</g>
<g id="shape-12" data-name="文本框 11">
<rect x="132.07" y="272.07" width="162.13" height="38.67" fill="none"/>
