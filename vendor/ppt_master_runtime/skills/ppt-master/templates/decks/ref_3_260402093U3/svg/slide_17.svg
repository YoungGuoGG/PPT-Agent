<text x="645.7" y="139.67" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">国务院建立国家级非物质文化遗产代表性项目名录，将体现中华民族优秀传统文化，具有重大历史</tspan><tspan x="645.7" dy="25.6" fill="#404040" font-size="21.33">、文学、艺术、科学价值的非物质文化遗产项目列入名录予以保护。</tspan></text>
