<g id="shape-11" data-name="组合 10">
<g id="shape-13" data-name="组合 12">
<g id="shape-14" data-name="文本框 13">
<rect x="346.93" y="314.93" width="293.2" height="258" fill="none"/>
<text x="493.53" y="337.87" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">唐三彩的生产已有1300多年</tspan><tspan x="493.53" dy="25.6" fill="#404040" font-size="21.33">的历史。它吸取了中国国画</tspan><tspan x="493.53" dy="25.6" fill="#404040" font-size="21.33">、雕塑等工艺美术的特点。</tspan><tspan x="493.53" dy="25.6" fill="#404040" font-size="21.33">唐三彩的制作工艺十分复杂</tspan><tspan x="493.53" dy="25.6" fill="#404040" font-size="21.33">。首先要将开采来的矿土经</tspan><tspan x="493.53" dy="25.6" fill="#404040" font-size="21.33">过挑选、舂捣、淘洗、沉淀</tspan><tspan x="493.53" dy="25.6" fill="#404040" font-size="21.33">、晾干后，用模具作成胎入</tspan><tspan x="493.53" dy="25.6" fill="#404040" font-size="21.33">窑烧制。</tspan></text>
</g>
<g id="shape-15" data-name="文本框 14">
