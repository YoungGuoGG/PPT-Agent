<g id="shape-8" data-name="文本框 7">
<rect x="518.13" y="419.07" width="719.33" height="255.23" fill="none"/>
<text x="527.73" y="442" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">l </tspan><tspan fill="#404040" font-size="21.33">其石窟则始凿于北魏孝文帝年间，盛于唐，终于清末。</tspan></text>
<text x="527.73" y="467.6" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">l </tspan><tspan fill="#404040" font-size="21.33">历经10多个朝代陆续营造长达1400余年，是世界上营造时间最长的石窟。 </tspan></text>
<text x="527.73" y="493.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">l </tspan><tspan fill="#404040" font-size="21.33">现存洞窟像龛2345个，造像11万余尊，建造时采用了大量彩绘，今大多已</tspan><tspan x="527.73" dy="25.6" fill="#404040" font-size="21.33">褪色。</tspan></text>
<text x="527.73" y="544.4" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">l </tspan><tspan fill="#404040" font-size="21.33">龙门石窟造像多为皇家贵族所建，是世界上绝无仅有的皇家石窟。</tspan></text>
<text x="527.73" y="570" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">l </tspan><tspan fill="#404040" font-size="21.33">著名景点：卢舍那大佛、“剪刀手”佛像、古阳洞、宾阳中洞、莲花洞</tspan></text>
<text x="527.73" y="595.6" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">l </tspan><tspan fill="#404040" font-size="21.33">地理位置：洛阳市洛龙区龙门镇龙门大道</tspan></text>
</g>
<g id="shape-3" data-name="组合 2">
<g id="shape-23" data-name="文本框 22">
<rect x="128.47" y="419.07" width="344.4" height="226.33" fill="none"/>
<text x="138.07" y="442" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">龙门石窟位于河南省洛阳市，是世</tspan><tspan x="138.07" dy="25.6" fill="#404040" font-size="21.33">界上造像最多、规模最大的石刻艺</tspan><tspan x="138.07" dy="25.6" fill="#404040" font-size="21.33">术宝库，被联合国教科文组织评为</tspan><tspan x="138.07" dy="25.6" fill="#404040" font-size="21.33">“中国石刻艺术的最高峰”，位居中</tspan><tspan x="138.07" dy="25.6" fill="#404040" font-size="21.33">国各大石窟之首。 现为世界文化</tspan><tspan x="138.07" dy="25.6" fill="#404040" font-size="21.33">遗产、全国重点文物保护单位、国</tspan><tspan x="138.07" dy="25.6" fill="#404040" font-size="21.33">家AAAAA级旅游景区。</tspan></text>
</g>
