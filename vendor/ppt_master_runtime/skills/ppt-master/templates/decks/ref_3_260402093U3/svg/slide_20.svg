<g id="shape-39" data-name="文本框 38">
<rect x="92.2" y="137.93" width="1119" height="102.47" fill="none"/>
<text x="651.7" y="160.87" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">据洛阳据旅游部门统计，2019年洛阳市接待中国国内外游客1.42亿人次，比上年增长7.3%；其中接待入境游客150.1万</tspan><tspan x="651.7" dy="25.6" fill="#404040" font-size="21.33">人次，增长6.2%。旅游总收入1321.02亿元，增长15.0%；其中创汇收入4.48亿美元，增长3.7%。年末共有A级旅游景</tspan><tspan x="651.7" dy="25.6" fill="#404040" font-size="21.33">区82处，比上年末增加11处，其中4A级以上景区30处。年末共有星级酒店48家，国际国内旅行社98家。</tspan></text>
</g>
