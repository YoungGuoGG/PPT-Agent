</g>
</g>
<g id="shape-15" data-name="文本框 14">
<rect x="181.53" y="139.73" width="935" height="35.4" fill="none"/>
<text x="649.03" y="162.67" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">洛阳因地处洛水之阳而得名。别名有斟鄩、西亳、洛邑、雒阳、洛京、京洛、神都等</tspan></text>
</g>
<g id="shape-5" data-name="组合 4">
