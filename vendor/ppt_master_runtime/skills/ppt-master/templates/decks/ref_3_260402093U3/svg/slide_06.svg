<text x="649.73" y="59.2" text-anchor="middle" xml:space="preserve" font-family="&quot;华文行楷&quot;, sans-serif" font-size="26.67" fill="#7E6338"><tspan fill="#7E6338" font-size="26.67">“洛阳”名称的由来</tspan></text>
</g>
<g id="shape-2" data-name="文本框 1">
<rect x="530.27" y="66.27" width="238.93" height="31" fill="none"/>
