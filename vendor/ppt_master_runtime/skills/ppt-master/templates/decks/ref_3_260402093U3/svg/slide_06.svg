</g>
<g id="shape-28" data-name="文本框 27">
<rect x="76.13" y="234.33" width="98" height="38.67" fill="none"/>
<text x="125.13" y="259.53" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">斟鄩</tspan></text>
</g>
<g id="shape-44" data-name="文本框 43">
<rect x="51.4" y="287.27" width="147.47" height="216.4" fill="none"/>
<text x="61" y="310.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">斟鄩，洛阳古</tspan><tspan x="61" dy="25.6" fill="#404040" font-size="21.33">称（含巩义）</tspan><tspan x="61" dy="25.6" fill="#404040" font-size="21.33">，为史籍记载</tspan><tspan x="61" dy="25.6" fill="#404040" font-size="21.33">中夏朝的都城</tspan><tspan x="61" dy="25.6" fill="#404040" font-size="21.33">。从夏朝第三</tspan><tspan x="61" dy="25.6" fill="#404040" font-size="21.33">任君主太康开</tspan><tspan x="61" dy="25.6" fill="#404040" font-size="21.33">始，到夏桀皆</tspan><tspan x="61" dy="25.6" fill="#404040" font-size="21.33">以斟鄩为都城</tspan></text>
</g>
</g>
<g id="shape-59" data-name="组合 58">
<g id="shape-60" data-name="矩形 59">
<rect x="218.73" y="222.2" width="154.93" height="340.4" fill="#FFFFFF" stroke="#7E6338" stroke-width="1"/>
</g>
<g id="shape-61" data-name="文本框 60">
<rect x="247.2" y="234.33" width="98" height="38.67" fill="none"/>
<text x="296.2" y="259.53" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">西亳</tspan></text>
</g>
<g id="shape-62" data-name="文本框 61">
<rect x="222.47" y="287.27" width="147.47" height="190.53" fill="none"/>
<text x="232.07" y="310.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">西亳（bó）</tspan><tspan x="232.07" dy="25.6" fill="#404040" font-size="21.33">，是洛阳在商</tspan><tspan x="232.07" dy="25.6" fill="#404040" font-size="21.33">代的旧称，又</tspan><tspan x="232.07" dy="25.6" fill="#404040" font-size="21.33">作亳，西亳为</tspan><tspan x="232.07" dy="25.6" fill="#404040" font-size="21.33">五帝时期帝喾</tspan><tspan x="232.07" dy="25.6" fill="#404040" font-size="21.33">的都城，商朝</tspan><tspan x="232.07" dy="25.6" fill="#404040" font-size="21.33">的立国之都。</tspan></text>
</g>
</g>
<g id="shape-63" data-name="组合 62">
<g id="shape-64" data-name="矩形 63">
<rect x="389.8" y="222.2" width="154.93" height="339.13" fill="#FFFFFF" stroke="#7E6338" stroke-width="1"/>
</g>
<g id="shape-65" data-name="文本框 64">
<rect x="418.27" y="234.33" width="98" height="38.67" fill="none"/>
<text x="467.27" y="259.53" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">洛邑</tspan></text>
</g>
<g id="shape-66" data-name="文本框 65">
<rect x="393.53" y="287.27" width="147.47" height="190.53" fill="none"/>
<text x="403.13" y="310.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">洛邑，是周朝</tspan><tspan x="403.13" dy="25.6" fill="#404040" font-size="21.33">都城洛阳的古</tspan><tspan x="403.13" dy="25.6" fill="#404040" font-size="21.33">称，“八方之</tspan><tspan x="403.13" dy="25.6" fill="#404040" font-size="21.33">广，周洛为中</tspan><tspan x="403.13" dy="25.6" fill="#404040" font-size="21.33">，谓之洛邑</tspan><tspan x="403.13" dy="25.6" fill="#404040" font-size="21.33">”。是当时世</tspan><tspan x="403.13" dy="25.6" fill="#404040" font-size="21.33">界最大城市之</tspan><tspan x="403.13" dy="25.6" fill="#404040" font-size="21.33">一。</tspan></text>
</g>
</g>
<g id="shape-67" data-name="组合 66">
<g id="shape-68" data-name="矩形 67">
<rect x="560.87" y="222.2" width="154.93" height="339.13" fill="#FFFFFF" stroke="#7E6338" stroke-width="1"/>
</g>
<g id="shape-69" data-name="文本框 68">
<rect x="589.33" y="234.33" width="98" height="38.67" fill="none"/>
<text x="638.33" y="259.53" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">雒阳</tspan></text>
</g>
<g id="shape-70" data-name="文本框 69">
<rect x="564.6" y="287.27" width="147.47" height="268.07" fill="none"/>
<text x="574.2" y="310.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">东汉光武帝以</tspan><tspan x="574.2" dy="25.6" fill="#404040" font-size="21.33">火德承运，忌</tspan><tspan x="574.2" dy="25.6" fill="#404040" font-size="21.33">国号“汉”和</tspan><tspan x="574.2" dy="25.6" fill="#404040" font-size="21.33">国都“洛阳</tspan><tspan x="574.2" dy="25.6" fill="#404040" font-size="21.33">”之水太盛，</tspan><tspan x="574.2" dy="25.6" fill="#404040" font-size="21.33">遂用其通假异</tspan><tspan x="574.2" dy="25.6" fill="#404040" font-size="21.33">体之“雒”字</tspan><tspan x="574.2" dy="25.6" fill="#404040" font-size="21.33">，所以东汉石</tspan><tspan x="574.2" dy="25.6" fill="#404040" font-size="21.33">经、碑刻多写</tspan><tspan x="574.2" dy="25.6" fill="#404040" font-size="21.33">作“雒”字。</tspan></text>
</g>
</g>
<g id="shape-71" data-name="组合 70">
<g id="shape-72" data-name="矩形 71">
<rect x="731.93" y="222.2" width="154.93" height="339.13" fill="#FFFFFF" stroke="#7E6338" stroke-width="1"/>
</g>
<g id="shape-73" data-name="文本框 72">
<rect x="760.4" y="234.33" width="98" height="38.67" fill="none"/>
<text x="809.4" y="259.53" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">洛京</tspan></text>
</g>
<g id="shape-74" data-name="文本框 73">
<rect x="735.67" y="287.27" width="147.47" height="268.07" fill="none"/>
<text x="745.27" y="310.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">洛京是洛阳的</tspan><tspan x="745.27" dy="25.6" fill="#404040" font-size="21.33">古称，“洛</tspan><tspan x="745.27" dy="25.6" fill="#404040" font-size="21.33">”是洛阳简称</tspan><tspan x="745.27" dy="25.6" fill="#404040" font-size="21.33">，“京”具有</tspan><tspan x="745.27" dy="25.6" fill="#404040" font-size="21.33">都城意义。由</tspan><tspan x="745.27" dy="25.6" fill="#404040" font-size="21.33">于自夏商周以</tspan><tspan x="745.27" dy="25.6" fill="#404040" font-size="21.33">来洛阳长期作</tspan><tspan x="745.27" dy="25.6" fill="#404040" font-size="21.33">为中国首都，</tspan><tspan x="745.27" dy="25.6" fill="#404040" font-size="21.33">因此人们常用</tspan><tspan x="745.27" dy="25.6" fill="#404040" font-size="21.33">洛京称呼洛阳</tspan><tspan x="745.27" dy="25.6" fill="#404040" font-size="21.33">。</tspan></text>
</g>
</g>
<g id="shape-75" data-name="组合 74">
<g id="shape-76" data-name="矩形 75">
<rect x="903" y="222.2" width="154.93" height="339.13" fill="#FFFFFF" stroke="#7E6338" stroke-width="1"/>
</g>
<g id="shape-77" data-name="文本框 76">
<rect x="931.47" y="234.33" width="98" height="38.67" fill="none"/>
<text x="980.47" y="259.53" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">京洛</tspan></text>
</g>
<g id="shape-78" data-name="文本框 77">
<rect x="906.73" y="287.27" width="147.47" height="216.4" fill="none"/>
<text x="916.33" y="310.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">京洛本为专用</tspan><tspan x="916.33" dy="25.6" fill="#404040" font-size="21.33">名词，原意为</tspan><tspan x="916.33" dy="25.6" fill="#404040" font-size="21.33">“京城洛阳</tspan><tspan x="916.33" dy="25.6" fill="#404040" font-size="21.33">”，因洛阳从</tspan><tspan x="916.33" dy="25.6" fill="#404040" font-size="21.33">夏代开始频繁</tspan><tspan x="916.33" dy="25.6" fill="#404040" font-size="21.33">作为都城，历</tspan><tspan x="916.33" dy="25.6" fill="#404040" font-size="21.33">十三代都会，</tspan><tspan x="916.33" dy="25.6" fill="#404040" font-size="21.33">后代多有沿用</tspan><tspan x="916.33" dy="25.6" fill="#404040" font-size="21.33">。</tspan></text>
</g>
</g>
<g id="shape-79" data-name="组合 78">
<g id="shape-80" data-name="矩形 79">
<rect x="1074.07" y="222.2" width="154.93" height="339.13" fill="#FFFFFF" stroke="#7E6338" stroke-width="1"/>
</g>
<g id="shape-81" data-name="文本框 80">
<rect x="1102.53" y="234.33" width="98" height="38.67" fill="none"/>
<text x="1151.53" y="259.53" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">神都</tspan></text>
</g>
<g id="shape-82" data-name="文本框 81">
<rect x="1077.8" y="287.27" width="147.47" height="268.07" fill="none"/>
<text x="1087.4" y="310.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">神都，唐朝洛</tspan><tspan x="1087.4" dy="25.6" fill="#404040" font-size="21.33">阳官称，多用</tspan><tspan x="1087.4" dy="25.6" fill="#404040" font-size="21.33">于武则天时代</tspan><tspan x="1087.4" dy="25.6" fill="#404040" font-size="21.33">，意为“神州</tspan><tspan x="1087.4" dy="25.6" fill="#404040" font-size="21.33">大地之都”，</tspan><tspan x="1087.4" dy="25.6" fill="#404040" font-size="21.33">是唐、武周帝</tspan><tspan x="1087.4" dy="25.6" fill="#404040" font-size="21.33">国的首都，乃</tspan><tspan x="1087.4" dy="25.6" fill="#404040" font-size="21.33">当时世界政治</tspan><tspan x="1087.4" dy="25.6" fill="#404040" font-size="21.33">、经济、文化</tspan><tspan x="1087.4" dy="25.6" fill="#404040" font-size="21.33">中心。</tspan></text>
</g>
</g></svg>