<rect x="194.89" y="467.66" width="310.15" height="179.82" fill="none"/>
<text x="349.97" y="490.59" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">在洛阳市九县六区中信仰伊斯</tspan><tspan x="349.97" dy="25.6" fill="#404040" font-size="21.33">兰教的主要有回族和维吾尔族</tspan><tspan x="349.97" dy="25.6" fill="#404040" font-size="21.33">，他们统称为&quot;穆斯林”或“穆</tspan><tspan x="349.97" dy="25.6" fill="#404040" font-size="21.33">民”，汉族中亦有少数人信仰。</tspan><tspan x="349.97" dy="25.6" fill="#404040" font-size="21.33">天主教于明代传入河南，大约</tspan><tspan x="349.97" dy="25.6" fill="#404040" font-size="21.33">在20世纪初传人洛阳。</tspan></text>
</g>
