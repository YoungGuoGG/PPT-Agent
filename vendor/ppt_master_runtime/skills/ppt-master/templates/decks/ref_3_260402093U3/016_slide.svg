<g id="shape-29" data-name="文本框 28">
<rect x="779.85" y="198.78" width="294.31" height="150.77" fill="none"/>
<text x="927" y="221.72" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">位于洛阳的老君山是道教始</tspan><tspan x="927" dy="25.6" fill="#404040" font-size="21.33">祖的老子李耳到此归隐修炼</tspan><tspan x="927" dy="25.6" fill="#404040" font-size="21.33">，使之成为“道源”和“祖庭</tspan><tspan x="927" dy="25.6" fill="#404040" font-size="21.33">”。有“天下无双圣境，世界</tspan><tspan x="927" dy="25.6" fill="#404040" font-size="21.33">第一仙山”的美誉。</tspan></text>
</g>
