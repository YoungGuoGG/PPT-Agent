<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720"><image href="../assets/image2.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
<g id="shape-11" data-name="组合 10">
<g id="shape-27" data-name="文本框 26">
<rect x="150.07" y="146.53" width="477.67" height="38.07" fill="none"/>
<text x="159.67" y="169.47" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">唐代，自高宗始仍以洛阳为都，称东都。</tspan></text>
</g>
<g id="shape-30" data-name="文本框 29">
<rect x="150.07" y="193.67" width="619.13" height="71.53" fill="none"/>
<text x="159.67" y="216.6" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">武德四年（621年），置洛州总管府，辖洛州、郑州等九州，洛</tspan><tspan x="159.67" dy="25.6" fill="#404040" font-size="21.33">州辖洛阳、河南等9县。</tspan></text>
</g>
<g id="shape-31" data-name="文本框 30">
<rect x="150.07" y="271.8" width="634.93" height="38.07" fill="none"/>
<text x="159.67" y="294.73" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">贞观元年（627年），分全国为十道，洛阳属河南道。</tspan></text>
</g>
<g id="shape-32" data-name="文本框 31">
<rect x="150.07" y="318.93" width="477.67" height="38.07" fill="none"/>
<text x="159.67" y="341.87" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">显庆二年（657年），置东都。</tspan></text>
</g>
<g id="shape-33" data-name="文本框 32">
<rect x="150.07" y="444.2" width="477.67" height="38.07" fill="none"/>
<text x="159.67" y="467.13" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">开元元年（713年），改洛州为河南府。</tspan></text>
</g>
<g id="shape-44" data-name="文本框 43">
<rect x="150.07" y="491.33" width="619.13" height="71.53" fill="none"/>
<text x="159.67" y="514.27" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">开元二十一年（733年），于洛阳置都畿道。天宝年间，改东都</tspan><tspan x="159.67" dy="25.6" fill="#404040" font-size="21.33">为东京。</tspan></text>
</g>
<g id="shape-45" data-name="文本框 44">
<rect x="150.07" y="366.07" width="626.93" height="71.53" fill="none"/>
<text x="159.67" y="389" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">武则天光宅元年（684年）始，改东都为神都，对都城进行扩建</tspan><tspan x="159.67" dy="25.6" fill="#404040" font-size="21.33">，修建了明堂、万国天枢等。</tspan></text>
</g>
<g id="shape-46" data-name="文本框 45">
<rect x="150.07" y="569.47" width="611.27" height="71.53" fill="none"/>
<text x="159.67" y="592.4" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">唐天祐四年（907年），后梁、后唐、后晋均曾都洛阳，后汉、</tspan><tspan x="159.67" dy="25.6" fill="#404040" font-size="21.33">后周以洛阳为陪都。</tspan></text>
</g>
<g id="shape-4" data-name="半闭框 3">
<rect x="125" y="123.07" width="45" height="46.27" fill="#7E6338" stroke="none" stroke-width="1"/>
</g>
<g id="shape-5" data-name="半闭框 4" transform="rotate(180 762.5 617.87)">
<rect x="740" y="594.73" width="45" height="46.27" fill="#7E6338" stroke="none" stroke-width="1"/>
</g>
</g>
<g id="shape-13" data-name="组合 12">
<g id="shape-14" data-name="文本框 13">
<rect x="504.47" y="31.73" width="288.53" height="38.13" fill="none"/>
<text x="648.73" y="59.2" text-anchor="middle" xml:space="preserve" font-family="&quot;华文行楷&quot;, sans-serif" font-size="26.67" fill="#7E6338"><tspan fill="#7E6338" font-size="26.67">洛阳的历史沿革</tspan></text>
</g>
<g id="shape-15" data-name="文本框 14">
<rect x="529.27" y="66.27" width="238.93" height="31" fill="none"/>
<text x="648.73" y="84.67" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="16" fill="#404040"><tspan fill="#404040" font-size="16">The history of Luoyang</tspan></text>
</g>
</g></svg>