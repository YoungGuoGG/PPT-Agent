<rect x="210.61" y="125.4" width="737.12" height="130.47" fill="none"/>
<text x="220.21" y="148.33" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#000000"><tspan fill="#000000" font-size="21.33">“天下无双圣境，世界第一仙山”。原名景室山，位于十三朝古都洛阳的栾川</tspan><tspan x="220.21" dy="25.6" fill="#000000" font-size="21.33">县县城东南三千米处。八百里伏牛山脉的主峰，玉皇顶海拔2217米。距今已</tspan><tspan x="220.21" dy="25.6" fill="#000000" font-size="21.33">有两千多年人文历史，是道教中历史最长的山脉。</tspan></text>
