<g id="shape-19" data-name="文本框 18">
<rect x="214.13" y="222.07" width="831.33" height="149.07" fill="none"/>
<text x="223.73" y="247.27" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="24" fill="#404040"><tspan fill="#404040" font-size="24">洛阳市有5000多年文明史、4000多年城市史、1500多年建都史 。洛阳是华夏</tspan><tspan x="223.73" dy="28.8" fill="#404040" font-size="24">文明的发祥地之一、丝绸之路的东方起点，隋唐大运河的中心 ，历史上先后</tspan><tspan x="223.73" dy="28.8" fill="#404040" font-size="24">有十三个王朝在洛阳建都。洛阳市有二里头遗址、偃师商城遗址、东周王城</tspan><tspan x="223.73" dy="28.8" fill="#404040" font-size="24">遗址、汉魏洛阳城遗址、隋唐洛阳城遗址等五大都城遗址。</tspan></text>
</g>
