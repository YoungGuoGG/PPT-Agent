<g id="shape-2" data-name="文本框 1">
<rect x="374.53" y="271.47" width="290.07" height="310.73" fill="none"/>
<text x="384.13" y="294.4" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">• </tspan><tspan fill="#404040" font-size="21.33">白马寺每年一度的“马寺钟</tspan><tspan x="384.13" dy="25.6" fill="#404040" font-size="21.33">声”活动，是人类祈福、辞旧</tspan><tspan x="384.13" dy="25.6" fill="#404040" font-size="21.33">迎新的特殊象征，并吸引了</tspan><tspan x="384.13" dy="25.6" fill="#404040" font-size="21.33">不少国外游客参加，入选“洛</tspan><tspan x="384.13" dy="25.6" fill="#404040" font-size="21.33">阳八大景”之中。</tspan></text>

<text x="384.13" y="451.2" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">• </tspan><tspan fill="#404040" font-size="21.33">白马寺现为第一批全国重</tspan><tspan x="384.13" dy="25.6" fill="#404040" font-size="21.33">点文物保护单位、首批国家</tspan><tspan x="384.13" dy="25.6" fill="#404040" font-size="21.33">AAAA级旅游景区。</tspan></text>
</g>
