</g>
<g id="shape-39" data-name="文本框 38">
<rect x="70.93" y="333.47" width="303.6" height="226.33" fill="none"/>
<text x="80.53" y="356.4" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">中国第一古刹，世界佛教圣地</tspan><tspan x="80.53" dy="25.6" fill="#404040" font-size="21.33">。位于河南省洛阳市，始建于</tspan><tspan x="80.53" dy="25.6" fill="#404040" font-size="21.33">东汉永平十一年（公元68年）</tspan><tspan x="80.53" dy="25.6" fill="#404040" font-size="21.33">，是佛教传入中国后兴建的第</tspan><tspan x="80.53" dy="25.6" fill="#404040" font-size="21.33">一座官办寺院，乃中国、越南</tspan><tspan x="80.53" dy="25.6" fill="#404040" font-size="21.33">、朝鲜、日本及欧美国家的</tspan><tspan x="80.53" dy="25.6" fill="#404040" font-size="21.33">“释源”和“祖庭”。</tspan></text>
</g>
</g>
