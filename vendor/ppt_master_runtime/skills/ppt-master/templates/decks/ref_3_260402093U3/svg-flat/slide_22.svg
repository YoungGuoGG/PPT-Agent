<text x="691" y="400" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;阿里巴巴普惠体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">• </tspan><tspan fill="#404040" font-size="21.33">白马寺内保存了大量元</tspan><tspan x="691" dy="25.6" fill="#404040" font-size="21.33">代夹纻干漆造像如三世佛</tspan><tspan x="691" dy="25.6" fill="#404040" font-size="21.33">、二天将、十八罗汉等，</tspan><tspan x="691" dy="25.6" fill="#404040" font-size="21.33">弥足珍贵。</tspan></text>
