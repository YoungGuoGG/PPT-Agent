</g>
<g id="shape-12" data-name="文本框 11">
<rect x="114.8" y="521.6" width="618.6" height="71.53" fill="none"/>
<text x="124.4" y="544.53" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">洛阳十三朝古都是:夏、商、东周、东汉、曹魏、西晋、北魏、</tspan><tspan x="124.4" dy="25.6" fill="#404040" font-size="21.33">隋、唐、武周、后梁、后唐、后晋。</tspan></text>
</g>
