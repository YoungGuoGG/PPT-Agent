<g id="shape-8" data-name="文本框 7">
<rect x="114.8" y="169.4" width="642.13" height="314.21" fill="none"/>
<text x="124.4" y="192.33" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">• </tspan><tspan fill="#404040" font-size="21.33">简称“洛”，别称洛邑、洛京</tspan></text>
<text x="124.4" y="217.93" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">• </tspan><tspan fill="#404040" font-size="21.33">河南省地级市，中原城市群副中心城市，</tspan></text>
<text x="124.4" y="243.53" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">• </tspan><tspan fill="#404040" font-size="21.33">洛阳市总面积15230平方千米，市区面积2274平方千米</tspan></text>
<text x="124.4" y="269.13" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">• </tspan><tspan fill="#404040" font-size="21.33">河南省西部，东西长约179千米，南北宽约168千米。</tspan></text>
<text x="124.4" y="294.73" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">• </tspan><tspan fill="#404040" font-size="21.33">横跨黄河中下游南北两岸，东邻郑州市，西接三门峡市，北跨黄</tspan><tspan x="124.4" dy="25.6" fill="#404040" font-size="21.33">河与焦作市接壤，南与平顶山市、南阳市相连。</tspan></text>
<text x="124.4" y="345.93" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">• </tspan><tspan fill="#404040" font-size="21.33">洛阳市有5000多年文明史、4000多年城市史、1500多年建都史</tspan><tspan x="124.4" dy="25.6" fill="#404040" font-size="21.33">。</tspan></text>
<text x="124.4" y="397.13" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;思源黑体&quot;, sans-serif" font-size="21.33" fill="#404040"><tspan fill="#404040" font-size="21.33">• </tspan><tspan fill="#404040" font-size="21.33">洛阳是华夏文明的发祥地之一、丝绸之路的东方起点 ，隋唐大运</tspan><tspan x="124.4" dy="25.6" fill="#404040" font-size="21.33">河的中心，历史上先后有十三个王朝在洛阳建都。</tspan></text>
</g>
