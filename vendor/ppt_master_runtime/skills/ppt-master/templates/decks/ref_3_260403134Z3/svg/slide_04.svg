<rect x="99.57" y="413.49" width="322.07" height="100.78" fill="none"/>
<text x="109.17" y="431.89" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, Arial, sans-serif" font-size="16" fill="#808080"><tspan fill="#808080" font-size="16">感受阳光的温暖；欣赏日出日落的美景，</tspan><tspan x="109.17" dy="19.2" fill="#808080" font-size="16">让心灵得到深度的滋养。旅行让我学会了</tspan><tspan x="109.17" dy="19.2" fill="#808080" font-size="16">如何照顾自己，让压力飞走，焕发出新的</tspan><tspan x="109.17" dy="19.2" fill="#808080" font-size="16">活力。</tspan></text>
</g>
<g id="shape-6" data-name="文本框 5">
<rect x="100.37" y="342.56" width="322.07" height="54.25" fill="none"/>
<text x="109.97" y="360.96" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, Arial, sans-serif" font-size="16" fill="#808080"><tspan fill="#808080" font-size="16">放松身心，放飞压力：在旅行中，我抛开</tspan><tspan x="109.97" dy="19.2" fill="#808080" font-size="16">了烦恼和压力，让自己完全放松。</tspan></text>
</g>
