<g id="shape-30" data-name="文本框 29">
<rect x="103.3" y="264.24" width="514.22" height="100.78" fill="none"/>
<text x="112.9" y="282.64" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, Arial, sans-serif" font-size="16" fill="#808080"><tspan fill="#808080" font-size="16"> 忙碌的都市生活让我疲惫不堪，我渴望一个属于自己的冒险，于是决</tspan><tspan x="112.9" dy="19.2" fill="#808080" font-size="16">定一个人踏上旅行的征程。如果你也厌倦了繁忙的生活，不妨放下一</tspan><tspan x="112.9" dy="19.2" fill="#808080" font-size="16">切，勇敢踏上属于自己的旅行。旅行不仅是一种体验，更是一种心灵</tspan><tspan x="112.9" dy="19.2" fill="#808080" font-size="16">的疗愈和成长！</tspan></text>
</g>
