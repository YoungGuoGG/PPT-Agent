<g id="shape-34" data-name="文本框 33">
<rect x="582.37" y="584.77" width="565.63" height="77.52" fill="none"/>
<text x="591.97" y="603.17" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, Arial, sans-serif" font-size="16" fill="#808080"><tspan fill="#808080" font-size="16"> 忙碌的都市生活让我疲惫不堪，我渴望一个属于自己的冒险，于是决定一个</tspan><tspan x="591.97" dy="19.2" fill="#808080" font-size="16">人踏上旅行的征程。如果你也厌倦了繁忙的生活，不妨放下一切，勇敢踏上属</tspan><tspan x="591.97" dy="19.2" fill="#808080" font-size="16">于自己的旅行。旅行不仅是一种体验，更是一种心灵的疗愈和成长！</tspan></text>
</g>
